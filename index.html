<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ওমর এস এস ঘর | হিসাব</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;background:#f3f6f9;color:#17202a}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px}
.primary{background:#087f5b;color:white}
.blue{background:#1971c2;color:white}
.red{background:#c92a2a;color:white}
.gray{background:#e9ecef;color:#222}
.card{background:white;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 3px 12px #00000010}
input,select,textarea{width:100%;padding:11px;border:1px solid #ccd3da;border-radius:9px;background:white}
textarea{min-height:80px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.top{background:#087f5b;color:white;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.top h2{margin:0;font-size:19px}
.menu{background:white;padding:10px;display:flex;gap:7px;overflow-x:auto;box-shadow:0 2px 8px #0001}
.menu button{white-space:nowrap;background:#edf2f7}
.menu button.active{background:#087f5b;color:white}
.page{display:none;padding:14px;max-width:1100px;margin:auto}
.page.active{display:block}
.login{max-width:430px;margin:60px auto;padding:22px}
.login h1{text-align:center}
.login input{margin:7px 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:white;padding:18px;border-radius:14px;text-align:center;box-shadow:0 2px 8px #0001}
.stat b{font-size:24px;display:block;margin-top:7px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #e9ecef;text-align:left}
.tablewrap{overflow:auto}
.badge{display:inline-block;padding:5px 9px;background:#e7f5ff;border-radius:20px}
.due{color:#c92a2a;font-weight:bold}
.ok{color:#087f5b;font-weight:bold}
.workerBox{border:1px solid #dee2e6;border-radius:13px;padding:14px;margin:10px 0}
.workerHead{display:flex;justify-content:space-between;gap:10px;align-items:center}
.workerName{font-size:18px;font-weight:bold}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:100;padding:15px;overflow:auto}
.modal.show{display:block}
.modalBox{background:white;max-width:900px;margin:25px auto;border-radius:16px;padding:18px}
.close{text-align:right}
.small{font-size:13px;color:#666}
.empty{text-align:center;padding:25px;color:#777}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.quick button{padding:16px}
@media(max-width:700px){
 .grid,.grid3,.stats{grid-template-columns:1fr 1fr}
 .stats .stat:last-child{grid-column:span 2}
 .quick{grid-template-columns:1fr 1fr}
 .top h2{font-size:16px}
}
@media(max-width:480px){
 .grid,.grid3,.stats{grid-template-columns:1fr}
 .stats .stat:last-child{grid-column:auto}
 .quick{grid-template-columns:1fr}
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="loginPage">
<div class="login card">
<h1>🏪 ওমর এস এস ঘর</h1>
<p style="text-align:center">হিসাব ব্যবস্থাপনা</p>

<input id="loginEmail" type="email" placeholder="ইমেইল">
<input id="loginPassword" type="password" placeholder="পাসওয়ার্ড">

<button class="primary" style="width:100%" onclick="login()">🔐 Login</button>
<br><br>
<button class="blue" style="width:100%" onclick="signup()">➕ নতুন Account</button>
<br><br>
<button class="gray" style="width:100%" onclick="forgotPassword()">পাসওয়ার্ড ভুলে গেছেন?</button>

<p id="loginMsg" class="small"></p>
</div>
</section>

<!-- MAIN -->
<section id="mainPage" style="display:none">

<header class="top">
<h2>🏪 ওমর এস এস ঘর</h2>
<button class="red" onclick="logout()">Logout</button>
</header>

<nav class="menu">
<button onclick="showPage('homePage',this)" class="active">🏠 Home</button>
<button onclick="showPage('customersPage',this)">👤 Customer</button>
<button onclick="showPage('newCustomerPage',this)">➕ New Customer</button>
<button onclick="showPage('duePage',this)">💰 Due</button>
<button onclick="showPage('materialsPage',this)">🔩 Materials</button>
<button onclick="showPage('workersPage',this)">👷 Mistri</button>
<button onclick="showPage('attendancePage',this)">🕐 Attendance</button>
</nav>

<!-- HOME -->
<section id="homePage" class="page active">
<div class="card">
<h2>🏠 Dashboard</h2>
<div class="stats">
<div class="stat">Customer<b id="homeCustomers">0</b></div>
<div class="stat">Mistri<b id="homeWorkers">0</b></div>
<div class="stat">Due<b id="homeDue">৳0</b></div>
<div class="stat">Materials<b id="homeMaterials">0</b></div>
</div>
</div>

<div class="card">
<h3>⚡ দ্রুত কাজ</h3>
<div class="quick">
<button class="blue" onclick="go('newCustomerPage')">➕ Customer</button>
<button class="primary" onclick="go('workersPage')">👷 Mistri</button>
<button class="gray" onclick="go('materialsPage')">🔩 Material</button>
<button class="gray" onclick="go('attendancePage')">🕐 Attendance</button>
</div>
</div>
</section>

<!-- CUSTOMERS -->
<section id="customersPage" class="page">
<div class="card">
<h2>👤 Customer List</h2>
<div id="customerList"></div>
</div>
</section>

<!-- NEW CUSTOMER -->
<section id="newCustomerPage" class="page">
<div class="card">
<h2>➕ নতুন Customer</h2>

<div class="grid">
<input id="customerName" placeholder="Customer Name">
<input id="customerPhone" placeholder="Phone Number">
<input id="customerAddress" placeholder="Address">
<input id="customerWork" placeholder="কাজের বিবরণ">
<input id="customerContract" type="number" placeholder="Contact Price">
<input id="customerDelivery" type="date">
</div>

<br>
<button class="primary" onclick="addCustomer()">💾 Customer Save</button>
</div>
</section>

<!-- DUE -->
<section id="duePage" class="page">
<div class="card">
<h2>💰 Due List</h2>
<div id="dueList"></div>
</div>
</section>

<!-- MATERIAL -->
<section id="materialsPage" class="page">
<div class="card">
<h2>🔩 Materials</h2>
<div class="grid">
<input id="materialName" placeholder="Material Name">
<input id="materialPrice" type="number" placeholder="Price">
</div>
<br>
<button class="primary" onclick="addMaterial()">➕ Material Save</button>
<div id="materialList"></div>
</div>
</section>

<!-- WORKERS -->
<section id="workersPage" class="page">
<div class="card">
<h2>👷 Mistri / Worker</h2>

<div class="grid">
<input id="workerName" placeholder="Mistri Name">
<input id="workerSalary" type="number" placeholder="Monthly Salary">
</div>

<br>
<button class="primary" onclick="addWorker()">➕ Mistri Save</button>

<hr>
<div id="workerList"></div>
</div>
</section>

<!-- ATTENDANCE -->
<section id="attendancePage" class="page">
<div class="card">
<h2>🕐 Mistri Attendance</h2>

<div class="grid">
<select id="attendanceWorker"></select>
<input id="attendanceDate" type="date">
</div>

<br>

<div class="quick">
<button class="primary" onclick="saveAttendance('present')">✅ Present</button>
<button class="red" onclick="saveAttendance('absent')">❌ Absent</button>
<button class="gray" onclick="saveAttendance('half')">½ Half</button>
</div>

<br>
<div id="attendanceList"></div>
</div>
</section>

</section>

<!-- CUSTOMER MODAL -->
<div id="customerModal" class="modal">
<div class="modalBox">
<div class="close">
<button class="red" onclick="closeCustomer()">✕</button>
</div>
<div id="customerDetail"></div>
</div>
</div>

<!-- WORKER DETAIL MODAL/PAGE -->
<div id="workerModal" class="modal">
<div class="modalBox">
<div class="close">
<button class="red" onclick="closeWorker()">✕</button>
</div>
<div id="workerDetail"></div>
</div>
</div>

<script>
const SUPABASE_URL="https://gzujcqjpxypcoiqhpvvu.supabase.co";
const SUPABASE_KEY="sb_publishable_3A5P427eZte1-uOzytOYSA_4bviRFcF";

const supabaseClient=window.supabase.createClient(
 SUPABASE_URL,SUPABASE_KEY
);

let currentUser=null;
let customers=[];
let materials=[];
let workers=[];
let currentWorker=null;
let currentCustomer=null;

function $(id){return document.getElementById(id)}

function money(n){
 return "৳"+Number(n||0).toLocaleString("en-IN");
}

function esc(v){
 return String(v??"")
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");
}

async function login(){
 const email=$("loginEmail").value.trim();
 const password=$("loginPassword").value;

 if(!email||!password){
  $("loginMsg").textContent="ইমেইল ও Password দিন।";
  return;
 }

 const {data,error}=await supabaseClient.auth.signInWithPassword({
  email,password
 });

 if(error){
  $("loginMsg").textContent=error.message;
  return;
 }

 currentUser=data.user;
 await startApp();
}

async function signup(){
 const email=$("loginEmail").value.trim();
 const password=$("loginPassword").value;

 if(!email||!password){
  $("loginMsg").textContent="ইমেইল ও Password দিন।";
  return;
 }

 if(password.length<6){
  $("loginMsg").textContent="Password কমপক্ষে ৬ অক্ষরের দিন।";
  return;
 }

 const {data,error}=await supabaseClient.auth.signUp({
  email,password
 });

 if(error){
  $("loginMsg").textContent=error.message;
  return;
 }

 $("loginMsg").textContent=
 "Account তৈরি হয়েছে। Email confirmation প্রয়োজন হলে Email দেখুন।";
}

async function forgotPassword(){
 const email=$("loginEmail").value.trim();

 if(!email){
  $("loginMsg").textContent="আগে Email লিখুন।";
  return;
 }

 const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{
  redirectTo:location.origin+location.pathname
 });

 $("loginMsg").textContent=
 error?error.message:"Password reset link Email-এ পাঠানো হয়েছে।";
}

async function logout(){
 await supabaseClient.auth.signOut();
 location.reload();
}

async function startApp(){
 $("loginPage").style.display="none";
 $("mainPage").style.display="block";

 await loadAll();
}

async function loadAll(){
 await loadCustomers();
 await loadMaterials();
 await loadWorkers();
 await loadDue();
}

function showPage(id,btn){
 document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
 $(id).classList.add("active");

 document.querySelectorAll(".menu button")
 .forEach(x=>x.classList.remove("active"));

 if(btn)btn.classList.add("active");

 if(id==="workersPage")loadWorkers();
 if(id==="attendancePage")loadAttendanceWorkers();
 if(id==="duePage")loadDue();
 if(id==="customersPage")loadCustomers();
}

function go(id){
 document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
 $(id).classList.add("active");
 window.scrollTo(0,0);
}

/* CUSTOMER */

async function loadCustomers(){
 const {data,error}=await supabaseClient
 .from("customers")
 .select("*")
 .eq("admin_id",currentUser.id)
 .order("created_at",{ascending:false});

 if(error){
  console.log(error);
  return;
 }

 customers=data||[];

 $("homeCustomers").textContent=customers.length;

 renderCustomers();
 await loadDue();
}

function renderCustomers(){
 if(!customers.length){
  $("customerList").innerHTML=
   '<div class="empty">কোনো Customer নেই।</div>';
  return;
 }

 $("customerList").innerHTML=customers.map(c=>`
 <div class="workerBox">
  <div class="workerHead">
   <div>
    <div class="workerName">${esc(c.name)}</div>
    <div>${esc(c.phone||"")}</div>
    <div class="small">${esc(c.address||"")}</div>
   </div>
   <button class="blue"
    onclick='openCustomer(${JSON.stringify(c.id)})'>
    📂 হিসাব
   </button>
  </div>
 </div>
 `).join("");
}

async function addCustomer(){
 const name=$("customerName").value.trim();

 if(!name){
  alert("Customer Name দিন।");
  return;
 }

 const {data,error}=await supabaseClient
 .from("customers")
 .insert({
  admin_id:currentUser.id,
  name,
  phone:$("customerPhone").value.trim(),
  address:$("customerAddress").value.trim(),
  work:$("customerWork").value.trim(),
  contract_price:Number($("customerContract").value||0),
  delivery_date:$("customerDelivery").value||null
 })
 .select()
 .single();

 if(error){
  alert(error.message);
  return;
 }

 alert("Customer Save হয়েছে।");

 ["customerName","customerPhone","customerAddress",
  "customerWork","customerContract","customerDelivery"]
 .forEach(id=>$(id).value="");

 await loadCustomers();
 go("customersPage");
}

async function openCustomer(id){
 currentCustomer=customers.find(c=>String(c.id)===String(id));

 if(!currentCustomer)return;

 await renderCustomerDetail();
 $("customerModal").classList.add("show");
}

function closeCustomer(){
 $("customerModal").classList.remove("show");
}

async function renderCustomerDetail(){
 const c=currentCustomer;

 const {data:payments}=await supabaseClient
 .from("customer_payments")
 .select("*")
 .eq("customer_id",c.id)
 .eq("admin_id",currentUser.id)
 .order("payment_date",{ascending:false});

 const paid=(payments||[])
 .reduce((a,x)=>a+Number(x.amount||0),0);

 const due=Math.max(Number(c.contract_price||0)-paid,0);

 const {data:cm}=await supabaseClient
 .from("customer_materials")
 .select("*")
 .eq("customer_id",c.id)
 .eq("admin_id",currentUser.id)
 .order("created_at",{ascending:false});

 const {data:cw}=await supabaseClient
 .from("customer_workers")
 .select("*")
 .eq("customer_id",c.id)
 .eq("admin_id",currentUser.id)
 .order("work_date",{ascending:false});

 const {data:ex}=await supabaseClient
 .from("customer_expenses")
 .select("*")
 .eq("customer_id",c.id)
 .eq("admin_id",currentUser.id)
 .order("created_at",{ascending:false});

 const materialTotal=(cm||[])
 .reduce((a,x)=>a+Number(x.total||0),0);

 const workerTotal=(cw||[])
 .reduce((a,x)=>a+Number(x.total||0),0);

 const expenseTotal=(ex||[])
 .reduce((a,x)=>a+Number(x.amount||0),0);

 $("customerDetail").innerHTML=`
 <h2>👤 ${esc(c.name)}</h2>

 <p>📞 ${esc(c.phone||"")}</p>
 <p>📍 ${esc(c.address||"")}</p>
 <p>🔨 ${esc(c.work||"")}</p>
 <p>🚚 Delivery: ${esc(c.delivery_date||"")}</p>

 <div class="stats">
  <div class="stat">Contract<b>${money(c.contract_price)}</b></div>
  <div class="stat">Paid<b>${money(paid)}</b></div>
  <div class="stat">Due<b class="due">${money(due)}</b></div>
  <div class="stat">Material<b>${money(materialTotal)}</b></div>
 </div>

 <div class="card">
  <h3>💳 Customer Payment</h3>

  <div class="grid">
   <input id="custPayDate" type="date"
    value="${new Date().toISOString().slice(0,10)}">

   <input id="custPayAmount" type="number"
    placeholder="কত টাকা নিয়েছেন?">
  </div>

  <br>
  <input id="custPayNote" placeholder="Note">

  <br><br>
  <button class="primary"
   onclick='addCustomerPayment(${JSON.stringify(c.id)})'>
   💾 Payment Save
  </button>
 </div>

 <div class="card">
  <h3>🔩 মাল যোগ করুন</h3>

  <div class="grid">
   <select id="customerMaterialSelect"
    onchange="materialPriceAuto()">
    <option value="">Material নির্বাচন করুন</option>
    ${materials.map(m=>`
     <option value="${m.id}"
      data-price="${Number(m.price||0)}">
      ${esc(m.name)} — ${money(m.price)}
     </option>
    `).join("")}
   </select>

   <input id="customerMaterialPrice" type="number"
    placeholder="Price">

   <input id="customerMaterialQty" type="number"
    placeholder="Quantity" value="1">

   <input id="customerMaterialName"
    placeholder="Material Name">
  </div>

  <br>
  <button class="primary"
   onclick='addCustomerMaterial(${JSON.stringify(c.id)})'>
   ➕ মাল যোগ
  </button>

  <div>
   ${(cm||[]).map(x=>`
    <p>🔩 ${esc(x.name)}
    × ${x.qty}
    = <b>${money(x.total)}</b></p>
   `).join("")||'<div class="empty">মাল নেই</div>'}
  </div>
 </div>

 <div class="card">
  <h3>👷 Mistri কাজ যোগ করুন</h3>

  <div class="grid">
   <select id="customerWorkerSelect">
    <option value="">Mistri নির্বাচন করুন</option>
    ${workers.map(w=>`
     <option value="${w.id}">
      ${esc(w.name)} — ${money(w.monthly_salary)}
     </option>
    `).join("")}
   </select>

   <input id="customerWorkerDays"
    type="number" step="0.5" placeholder="কত দিন">

   <input id="customerWorkerSalary"
    type="number" placeholder="Monthly Salary">

   <input id="customerWorkerDate" type="date"
    value="${new Date().toISOString().slice(0,10)}">
  </div>

  <br>
  <button class="primary"
   onclick='addCustomerWorker(${JSON.stringify(c.id)})'>
   ➕ Mistri কাজ যোগ
  </button>

  <div>
   ${(cw||[]).map(x=>`
    <p>
     👷 ${esc(x.name)}
     | ${x.days} দিন
     | ${money(x.total)}
     | ${esc(x.work_date||"")}
    </p>
   `).join("")||'<div class="empty">Mistri কাজ নেই</div>'}
  </div>
 </div>

 <div class="card">
  <h3>📋 হিসাব</h3>
  <p>🔩 মাল: <b>${money(materialTotal)}</b></p>
  <p>👷 মিস্ত্রি: <b>${money(workerTotal)}</b></p>
  <p>📦 অন্যান্য: <b>${money(expenseTotal)}</b></p>
  <p>💰 মোট খরচ:
   <b>${money(materialTotal+workerTotal+expenseTotal)}</b>
  </p>
  <p>📈 লাভ:
   <b class="ok">
   ${money(Number(c.contract_price||0)-
    materialTotal-workerTotal-expenseTotal)}
   </b>
  </p>
 </div>

 <div class="card">
  <h3>💳 Payment History</h3>
  ${(payments||[]).map(x=>`
   <p>📅 ${esc(x.payment_date||"")}
   — <b>${money(x.amount)}</b>
   — ${esc(x.note||"")}</p>
  `).join("")||'<div class="empty">Payment নেই</div>'}
 </div>
 `;
}

function materialPriceAuto(){
 const s=$("customerMaterialSelect");
 const o=s.options[s.selectedIndex];
 $("customerMaterialPrice").value=o?.dataset?.price||"";

 if(o?.value){
  const m=materials.find(x=>String(x.id)===String(o.value));
  if(m)$("customerMaterialName").value=m.name;
 }
}

async function addCustomerMaterial(customerId){
 const materialId=$("customerMaterialSelect").value;
 const name=$("customerMaterialName").value.trim();
 const price=Number($("customerMaterialPrice").value||0);
 const qty=Number($("customerMaterialQty").value||0);

 if(!name||!price||!qty){
  alert("Material, Price এবং Quantity দিন।");
  return;
 }

 const {error}=await supabaseClient
 .from("customer_materials")
 .insert({
  admin_id:currentUser.id,
  customer_id:customerId,
  material_id:materialId||null,
  name,
  price,
  qty,
  total:price*qty
 });

 if(error){
  alert(error.message);
  return;
 }

 await renderCustomerDetail();
 await loadCustomers();
}

async function addCustomerWorker(customerId){
 const workerId=$("customerWorkerSelect").value;
 const days=Number($("customerWorkerDays").value||0);
 const salary=Number($("customerWorkerSalary").value||0);
 const workDate=$("customerWorkerDate").value;

 if(!workerId||!days||!salary){
  alert("Mistri, দিন ও Salary দিন।");
  return;
 }

 const worker=workers.find(
  w=>String(w.id)===String(workerId)
 );

 const total=(salary/30)*days;

 const {error}=await supabaseClient
 .from("customer_workers")
 .insert({
  admin_id:currentUser.id,
  customer_id:customerId,
  worker_id:workerId,
  name:worker?.name||"",
  salary,
  days,
  total,
  work_date:workDate||null
 });

 if(error){
  alert(error.message);
  return;
 }

 alert("Mistri কাজ Save হয়েছে।");

 await renderCustomerDetail();
}

async function addCustomerPayment(customerId){
 const amount=Number($("custPayAmount").value||0);

 if(!amount){
  alert("Payment amount দিন।");
  return;
 }

 const {error}=await supabaseClient
 .from("customer_payments")
 .insert({
  admin_id:currentUser.id,
  customer_id:customerId,
  payment_date:$("custPayDate").value||
   new Date().toISOString().slice(0,10),
  amount,
  note:$("custPayNote").value.trim()
 });

 if(error){
  alert(error.message);
  return;
 }

 alert("Customer Payment Save হয়েছে।");

 await renderCustomerDetail();
 await loadCustomers();
}

/* DUE */

async function loadDue(){
 if(!customers.length){
  $("homeDue").textContent="৳0";
  $("dueList").innerHTML=
   '<div class="empty">কোনো Due নেই।</div>';
  return;
 }

 const {data:payments,error}=await supabaseClient
 .from("customer_payments")
 .select("customer_id,amount")
 .eq("admin_id",currentUser.id);

 if(error){
  console.log(error);
  return;
 }

 let totalDue=0;
 let html="";

 customers.forEach(c=>{
  const paid=(payments||[])
   .filter(x=>String(x.customer_id)===String(c.id))
   .reduce((a,x)=>a+Number(x.amount||0),0);

  const due=Math.max(
   Number(c.contract_price||0)-paid,0
  );

  if(due>0){
   totalDue+=due;

   html+=`
   <div class="workerBox">
    <div class="workerHead">
     <div>
      <div class="workerName">${esc(c.name)}</div>
      <div class="due">${money(due)} বাকি</div>
     </div>

     <button class="blue"
      onclick='openCustomer(${JSON.stringify(c.id)})'>
      📂 হিসাব
     </button>
    </div>
   </div>`;
  }
 });

 $("homeDue").textContent=money(totalDue);

 $("dueList").innerHTML=html||
  '<div class="empty">🎉 কোনো Due নেই।</div>';
}

/* MATERIALS */

async function loadMaterials(){
 const {data,error}=await supabaseClient
 .from("materials")
 .select("*")
 .eq("admin_id",currentUser.id)
 .order("name");

 if(error)return;

 materials=data||[];

 $("homeMaterials").textContent=materials.length;

 renderMaterials();
}

function renderMaterials(){
 if(!materials.length){
  $("materialList").innerHTML=
   '<div class="empty">কোনো Material নেই।</div>';
  return;
 }

 $("materialList").innerHTML=`
 <div class="tablewrap">
 <table>
 <tr><th>Material</th><th>Price</th><th>Action</th></tr>

 ${materials.map(m=>`
 <tr>
  <td>${esc(m.name)}</td>
  <td>${money(m.price)}</td>
  <td>
   <button class="red"
    onclick='deleteMaterial(${JSON.stringify(m.id)})'>
    Delete
   </button>
  </td>
 </tr>
 `).join("")}
 </table>
 </div>`;
}

async function addMaterial(){
 const name=$("materialName").value.trim();
 const price=Number($("materialPrice").value||0);

 if(!name||!price){
  alert("Material Name ও Price দিন।");
  return;
 }

 const {error}=await supabaseClient
 .from("materials")
 .insert({
  admin_id:currentUser.id,
  name,
  price
 });

 if(error){
  alert(error.message);
  return;
 }

 $("materialName").value="";
 $("materialPrice").value="";

 await loadMaterials();
}

async function deleteMaterial(id){
 if(!confirm("Material মুছে ফেলবেন?"))return;

 await supabaseClient
 .from("materials")
 .delete()
 .eq("id",id)
 .eq("admin_id",currentUser.id);

 await loadMaterials();
}

/* WORKERS */

async function loadWorkers(){
 const {data,error}=await supabaseClient
 .from("workers")
 .select("*")
 .eq("admin_id",currentUser.id)
 .order("name");

 if(error){
  console.log(error);
  return;
 }

 workers=data||[];

 $("homeWorkers").textContent=workers.length;

 renderWorkers();
 await loadAttendanceWorkers();
}

function renderWorkers(){
 if(!workers.length){
  $("workerList").innerHTML=
   '<div class="empty">কোনো Mistri নেই।</div>';
  return;
 }

 $("workerList").innerHTML=workers.map(w=>`
 <div class="workerBox">
  <div class="workerHead">
   <div>
    <div class="workerName">👷 ${esc(w.name)}</div>
    <div>💰 মাসিক Salary: ${money(w.monthly_salary)}</div>
    <div>🔑 Code:
     <span class="badge">${esc(w.portal_code||"----")}</span>
    </div>
   </div>

   <div>
    <button class="blue"
     onclick='openWorker(${JSON.stringify(w.id)})'>
     📂 হিসাব খুলুন
    </button>

    <button class="red"
     onclick='deleteWorker(${JSON.stringify(w.id)})'>
     Delete
    </button>
   </div>
  </div>
 </div>
 `).join("");
}

async function addWorker(){
 const name=$("workerName").value.trim();
 const salary=Number($("workerSalary").value||0);

 if(!name){
  alert("Mistri Name দিন।");
  return;
 }

 const {data,error}=await supabaseClient
 .from("workers")
 .insert({
  admin_id:currentUser.id,
  name,
  monthly_salary:salary
 })
 .select()
 .single();

 if(error){
  alert(error.message);
  return;
 }

 alert(
  "মিস্ত্রি Save হয়েছে।\n\n"+
  "মিস্ত্রির Code: "+(data?.portal_code||"----")
 );

 $("workerName").value="";
 $("workerSalary").value="";

 await loadWorkers();

 /* নতুন মিস্ত্রির হিসাব পেজ সঙ্গে সঙ্গে খুলবে */
 openWorker(data.id);
}

async function deleteWorker(id){
 if(!confirm("এই Mistri মুছে ফেলবেন?"))return;

 await supabaseClient
 .from("workers")
 .delete()
 .eq("id",id)
 .eq("admin_id",currentUser.id);

 await loadWorkers();
}

/* WORKER DETAIL */

async function openWorker(workerId){
 currentWorker=workers.find(
  w=>String(w.id)===String(workerId)
 );

 if(!currentWorker)return;

 await renderWorkerDetail();

 $("workerModal").classList.add("show");
}

function closeWorker(){
 $("workerModal").classList.remove("show");
}

async function renderWorkerDetail(){
 const w=currentWorker;

 const {data:works}=await supabaseClient
 .from("customer_workers")
 .select("*")
 .eq("worker_id",w.id)
 .eq("admin_id",currentUser.id)
 .order("work_date",{ascending:false});

 const {data:payments}=await supabaseClient
 .from("worker_payments")
 .select("*")
 .eq("worker_id",w.id)
 .eq("admin_id",currentUser.id)
 .order("payment_date",{ascending:false});

 const {data:attendance}=await supabaseClient
 .from("worker_attendance")
 .select("*")
 .eq("worker_id",w.id)
 .eq("admin_id",currentUser.id)
 .order("attendance_date",{ascending:false});

 const totalDays=(works||[])
 .reduce((a,x)=>a+Number(x.days||0),0);

 const totalEarned=(works||[])
 .reduce((a,x)=>a+Number(x.total||0),0);

 const totalPaid=(payments||[])
 .reduce((a,x)=>a+Number(x.amount||0),0);

 const due=Math.max(totalEarned-totalPaid,0);

 const present=(attendance||[])
 .reduce((a,x)=>{
  if(x.status==="present")return a+1;
  if(x.status==="half")return a+.5;
  return a;
 },0);

 $("workerDetail").innerHTML=`
 <h2>👷 ${esc(w.name)}</h2>

 <p>
 🔑 Code:
 <span class="badge">${esc(w.portal_code||"----")}</span>
 </p>

 <p>💰 মাসিক Salary:
 <b>${money(w.monthly_salary)}</b></p>

 <div class="stats">
  <div class="stat">
   📅 কাজের দিন
   <b>${totalDays}</b>
  </div>

  <div class="stat">
   💵 মোট কাজ
   <b>${money(totalEarned)}</b>
  </div>

  <div class="stat">
   💳 দেওয়া হয়েছে
   <b>${money(totalPaid)}</b>
  </div>

  <div class="stat">
   🔴 পাওনা
   <b class="due">${money(due)}</b>
  </div>
 </div>

 <div class="card">
  <h3>💳 মিস্ত্রিকে টাকা দিন</h3>

  <div class="grid">
   <input id="workerPayDate" type="date"
    value="${new Date().toISOString().slice(0,10)}">

   <input id="workerPayAmount"
    type="number"
    placeholder="কত টাকা দিয়েছেন?">
  </div>

  <br>

  <input id="workerPayNote"
   placeholder="Note / কারণ">

  <br><br>

  <button class="primary"
   onclick='addWorkerPayment(${JSON.stringify(w.id)})'>
   💾 টাকা Save
  </button>
 </div>

 <div class="card">
  <h3>📋 কাজের হিসাব</h3>

  <p>
   মোট কাজের দিন:
   <b>${totalDays}</b>
  </p>

  <p>
   মোট কাজের টাকা:
   <b>${money(totalEarned)}</b>
  </p>

  ${
   (works||[]).length
   ?`
   <div class="tablewrap">
   <table>
   <tr>
    <th>তারিখ</th>
    <th>Customer</th>
    <th>দিন</th>
    <th>টাকা</th>
   </tr>

   ${(works||[]).map(x=>`
   <tr>
    <td>${esc(x.work_date||"")}</td>
    <td>${esc(x.customer_id||"")}</td>
    <td>${x.days}</td>
    <td>${money(x.total)}</td>
   </tr>
   `).join("")}
   </table>
   </div>`
   :'<div class="empty">এখনও কোনো কাজের হিসাব নেই।</div>'
  }
 </div>

 <div class="card">
  <h3>💳 টাকা নেওয়ার / পাওয়ার ইতিহাস</h3>

  ${
   (payments||[]).length
   ?`
   <div class="tablewrap">
   <table>
   <tr>
    <th>তারিখ</th>
    <th>টাকা</th>
    <th>Note</th>
   </tr>

   ${(payments||[]).map(x=>`
   <tr>
    <td>${esc(x.payment_date||"")}</td>
    <td>${money(x.amount)}</td>
    <td>${esc(x.note||"")}</td>
   </tr>
   `).join("")}
   </table>
   </div>`
   :'<div class="empty">এখনও কোনো Payment নেই।</div>'
  }
 </div>

 <div class="card">
  <h3>🕐 Attendance</h3>

  <p>
   Attendance অনুযায়ী কাজের দিন:
   <b>${present}</b>
  </p>

  ${
   (attendance||[]).length
   ?`
   <div class="tablewrap">
   <table>
   <tr>
    <th>তারিখ</th>
    <th>অবস্থা</th>
   </tr>

   ${(attendance||[]).map(x=>`
   <tr>
    <td>${esc(x.attendance_date||"")}</td>
    <td>
     ${
      x.status==="present"
      ?"✅ Present"
      :x.status==="half"
      ?"½ Half"
      :"❌ Absent"
     }
    </td>
   </tr>
   `).join("")}
   </table>
   </div>`
   :'<div class="empty">Attendance নেই।</div>'
  }
 </div>

 <div class="card">
  <h3>📊 মিস্ত্রির বর্তমান হিসাব</h3>

  <p>মোট কাজের টাকা:
   <b>${money(totalEarned)}</b>
  </p>

  <p>মোট দেওয়া টাকা:
   <b>${money(totalPaid)}</b>
  </p>

  <hr>

  <p style="font-size:20px">
   🔴 মিস্ত্রির পাওনা:
   <b class="due">${money(due)}</b>
  </p>
 </div>
 `;
}

async function addWorkerPayment(workerId){
 const amount=Number($("workerPayAmount").value||0);

 if(!amount){
  alert("কত টাকা দিয়েছেন সেটা লিখুন।");
  return;
 }

 const {error}=await supabaseClient
 .from("worker_payments")
 .insert({
  admin_id:currentUser.id,
  worker_id:workerId,
  payment_date:$("workerPayDate").value||
   new Date().toISOString().slice(0,10),
  amount,
  note:$("workerPayNote").value.trim()
 });

 if(error){
  alert(error.message);
  return;
 }

 alert("মিস্ত্রির Payment Save হয়েছে।");

 await renderWorkerDetail();
}

/* ATTENDANCE */

function loadAttendanceWorkers(){
 $("attendanceWorker").innerHTML=
 '<option value="">Mistri নির্বাচন করুন</option>'+
 workers.map(w=>`
  <option value="${w.id}">
   ${esc(w.name)}
  </option>
 `).join("");

 loadAttendanceList();
}

async function saveAttendance(status){
 const workerId=$("attendanceWorker").value;
 const date=$("attendanceDate").value;

 if(!workerId||!date){
  alert("Mistri ও Date নির্বাচন করুন।");
  return;
 }

 const {error}=await supabaseClient
 .from("worker_attendance")
 .upsert({
  admin_id:currentUser.id,
  worker_id:workerId,
  attendance_date:date,
  status
 },{
  onConflict:"worker_id,attendance_date"
 });

 if(error){
  alert(error.message);
  return;
 }

 alert("Attendance Save হয়েছে।");

 await loadAttendanceList();
}

async function loadAttendanceList(){
 const workerId=$("attendanceWorker").value;

 if(!workerId){
  $("attendanceList").innerHTML="";
  return;
 }

 const {data,error}=await supabaseClient
 .from("worker_attendance")
 .select("*")
 .eq("admin_id",currentUser.id)
 .eq("worker_id",workerId)
 .order("attendance_date",{ascending:false})
 .limit(100);

 if(error)return;

 $("attendanceList").innerHTML=`
 <div class="tablewrap">
 <table>
 <tr>
  <th>Date</th>
  <th>Status</th>
 </tr>

 ${(data||[]).map(x=>`
 <tr>
  <td>${esc(x.attendance_date)}</td>
  <td>
   ${
    x.status==="present"
    ?"✅ Present"
    :x.status==="half"
    ?"½ Half"
    :"❌ Absent"
   }
  </td>
 </tr>
 `).join("")}
 </table>
 </div>`;
}

$("attendanceWorker").addEventListener("change",loadAttendanceList);

/* SESSION */

supabaseClient.auth.getSession().then(async({data})=>{
 if(data.session){
  currentUser=data.session.user;
  await startApp();
 }
});
</script>
