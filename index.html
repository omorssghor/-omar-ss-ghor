<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ওমর এস এস ঘর</title>
<meta name="description" content="ওমর এস এস ঘর — সামাজিক যোগাযোগ, পোস্ট, ছবি, লাইক ও কমেন্ট।">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f0f2f5;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  color:#222
}
header{
  position:sticky;
  top:0;
  z-index:20;
  background:#fff;
  border-bottom:1px solid #ddd;
  padding:12px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 1px 4px #0001
}
.logo{
  font-size:22px;
  font-weight:bold
}
.user-area{
  display:flex;
  gap:8px;
  align-items:center
}
button{
  border:0;
  border-radius:8px;
  padding:10px 15px;
  cursor:pointer;
  font-size:15px
}
.primary{background:#1877f2;color:white}
.gray{background:#e4e6eb}
.danger{background:#e41e3f;color:white}

.container{
  max-width:700px;
  margin:20px auto;
  padding:0 10px
}
.card{
  background:white;
  border-radius:12px;
  margin-bottom:16px;
  box-shadow:0 1px 4px #0001;
  overflow:hidden
}
.card-body{padding:15px}
.profile{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:12px
}
.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#1877f2;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold
}
.name{font-weight:bold}
.date{
  color:#777;
  font-size:12px;
  margin-top:3px
}
textarea,input{
  width:100%;
  padding:12px;
  border:1px solid #ccd0d5;
  border-radius:8px;
  font-size:15px;
  margin-bottom:10px
}
textarea{min-height:90px;resize:vertical}
.preview{
  width:100%;
  max-height:500px;
  object-fit:cover;
  border-radius:8px;
  margin-top:5px
}
.actions{
  display:flex;
  gap:6px;
  border-top:1px solid #eee;
  margin-top:12px;
  padding-top:8px
}
.actions button{
  flex:1;
  background:white
}
.actions button:hover{background:#f0f2f5}
.like-on{color:#1877f2;font-weight:bold}

.stats{
  display:flex;
  justify-content:space-between;
  color:#777;
  font-size:13px;
  padding-bottom:5px
}
.comment{
  background:#f0f2f5;
  border-radius:15px;
  padding:9px 12px;
  margin-top:8px
}
.reply{
  margin-left:35px
}
.comment-name{font-weight:bold;font-size:14px}
.comment-text{margin-top:3px}
.comment-box{
  display:flex;
  gap:6px;
  margin-top:10px
}
.comment-box input{margin:0}
.small{
  font-size:12px;
  color:#1877f2;
  cursor:pointer;
  margin-left:8px
}
.empty{
  text-align:center;
  color:#777;
  padding:30px
}
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:50;
  align-items:center;
  justify-content:center;
  padding:15px
}
.modal-box{
  background:white;
  width:100%;
  max-width:420px;
  border-radius:14px;
  padding:20px
}
.modal-box h2{margin-top:0}
.close{
  float:right;
  font-size:25px;
  cursor:pointer
}
.status{
  padding:10px;
  border-radius:8px;
  background:#f0f2f5;
  margin-bottom:10px;
  font-size:14px
}
#loading{text-align:center;padding:25px;color:#666}

@media(max-width:600px){
  header{padding:10px}
  .logo{font-size:18px}
  .container{margin-top:10px}
}
</style>
</head>

<body>

<header>
  <div class="logo">🏪 ওমর এস এস ঘর</div>

  <div class="user-area">
    <span id="headerUser"></span>
    <button id="loginBtn" class="primary" onclick="openLogin()">লগইন</button>
    <button id="logoutBtn" class="danger" onclick="logout()" style="display:none">লগআউট</button>
  </div>
</header>

<div class="container">

  <!-- পোস্ট তৈরি -->
  <div class="card">
    <div class="card-body">

      <div id="guestMessage" class="status">
        পোস্ট করতে আগে লগইন করুন।
      </div>

      <div id="postCreator" style="display:none">
        <textarea id="postText" placeholder="আপনার মনের কথা লিখুন..."></textarea>

        <input
          type="file"
          id="postImage"
          accept="image/*"
          onchange="previewImage(event)"
        >

        <img id="imagePreview" class="preview" style="display:none">

        <button class="primary" style="width:100%;margin-top:8px" onclick="createPost()">
          পোস্ট করুন
        </button>
      </div>

    </div>
  </div>

  <!-- পোস্ট -->
  <div id="loading">পোস্ট লোড হচ্ছে...</div>
  <div id="posts"></div>

</div>

<!-- লগইন / রেজিস্ট্রেশন -->
<div class="modal" id="authModal">
  <div class="modal-box">

    <span class="close" onclick="closeLogin()">×</span>

    <h2 id="authTitle">লগইন</h2>

    <input id="authName" placeholder="আপনার নাম" style="display:none">

    <input id="authEmail" type="email" placeholder="ইমেইল">

    <input id="authPassword" type="password" placeholder="পাসওয়ার্ড">

    <button class="primary" style="width:100%" onclick="submitAuth()">
      <span id="authButtonText">লগইন</span>
    </button>

    <p style="text-align:center;margin-bottom:0">
      <span id="switchText">নতুন সদস্য?</span>
      <span class="small" onclick="switchAuth()">রেজিস্ট্রেশন করুন</span>
    </p>

    <div id="authMessage" class="status" style="display:none"></div>

  </div>
</div>

<script>
/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://gzujcqjpxypcoiqhpvvu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3A5P427eZte1-uOzytOYSA_4bviRFcF";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   VARIABLES
========================= */

let currentUser = null;
let isRegister = false;


/* =========================
   AUTH
========================= */

async function loadUser(){

  const {data,error} =
    await supabaseClient.auth.getUser();

  if(error){
    console.log(error);
  }

  currentUser = data?.user || null;

  updateUI();
}


function updateUI(){

  const loginBtn =
    document.getElementById("loginBtn");

  const logoutBtn =
    document.getElementById("logoutBtn");

  const headerUser =
    document.getElementById("headerUser");

  const guest =
    document.getElementById("guestMessage");

  const creator =
    document.getElementById("postCreator");

  if(currentUser){

    const name =
      currentUser.user_metadata?.full_name ||
      currentUser.email?.split("@")[0] ||
      "ব্যবহারকারী";

    headerUser.textContent = name;

    loginBtn.style.display="none";
    logoutBtn.style.display="block";

    guest.style.display="none";
    creator.style.display="block";

  }else{

    headerUser.textContent="";

    loginBtn.style.display="block";
    logoutBtn.style.display="none";

    guest.style.display="block";
    creator.style.display="none";
  }
}


function openLogin(){

  isRegister=false;

  document.getElementById("authModal")
    .style.display="flex";

  updateAuthMode();
}


function closeLogin(){

  document.getElementById("authModal")
    .style.display="none";
}


function switchAuth(){

  isRegister=!isRegister;

  updateAuthMode();
}


function updateAuthMode(){

  document.getElementById("authTitle").textContent =
    isRegister ? "নতুন অ্যাকাউন্ট" : "লগইন";

  document.getElementById("authButtonText").textContent =
    isRegister ? "রেজিস্ট্রেশন করুন" : "লগইন";

  document.getElementById("authName").style.display =
    isRegister ? "block" : "none";

  document.getElementById("switchText").textContent =
    isRegister ? "আগে থেকেই অ্যাকাউন্ট আছে?" : "নতুন সদস্য?";

  document.querySelector(".small").textContent =
    isRegister ? "লগইন করুন" : "রেজিস্ট্রেশন করুন";

  document.getElementById("authMessage").style.display="none";
}


async function submitAuth(){

  const name =
    document.getElementById("authName").value.trim();

  const email =
    document.getElementById("authEmail").value.trim();

  const password =
    document.getElementById("authPassword").value;

  const message =
    document.getElementById("authMessage");

  message.style.display="block";

  if(!email || !password){

    message.textContent =
      "ইমেইল ও পাসওয়ার্ড দিন।";

    return;
  }

  if(isRegister){

    if(!name){

      message.textContent =
        "আপনার নাম লিখুন।";

      return;
    }

    const {data,error} =
      await supabaseClient.auth.signUp({

        email:email,
        password:password,

        options:{
          data:{
            full_name:name
          }
        }

      });

    if(error){

      message.textContent =
        "রেজিস্ট্রেশন হয়নি: "+error.message;

      return;
    }

    message.textContent =
      "রেজিস্ট্রেশন সফল হয়েছে। ইমেইল যাচাই করতে হতে পারে।";

  }else{

    const {data,error} =
      await supabaseClient.auth.signInWithPassword({

        email:email,
        password:password

      });

    if(error){

      message.textContent =
        "লগইন হয়নি: "+error.message;

      return;
    }

    currentUser=data.user;

    closeLogin();

    updateUI();

    loadPosts();
  }
}


async function logout(){

  await supabaseClient.auth.signOut();

  currentUser=null;

  updateUI();

  loadPosts();
}


/* =========================
   IMAGE PREVIEW
========================= */

function previewImage(event){

  const file =
    event.target.files[0];

  const preview =
    document.getElementById("imagePreview");

  if(!file){

    preview.style.display="none";
    return;
  }

  const reader =
    new FileReader();

  reader.onload=function(e){

    preview.src=e.target.result;

    preview.style.display="block";
  };

  reader.readAsDataURL(file);
}


/* =========================
   CREATE POST
========================= */

async function createPost(){

  if(!currentUser){

    openLogin();
    return;
  }

  const text =
    document.getElementById("postText")
      .value.trim();

  const file =
    document.getElementById("postImage")
      .files[0];

  if(!text && !file){

    alert("পোস্টে লেখা অথবা ছবি দিন।");
    return;
  }

  /*
    আপাতত ছবি সরাসরি posts.image_url-এ
    রাখা হচ্ছে না।
    
    ছবি Storage যুক্ত করার পর
    এখানে স্বয়ংক্রিয় আপলোড যোগ করা যাবে।
  */

  const {error} =
    await supabaseClient
      .from("posts")
      .insert({

        user_id:currentUser.id,

        content:text,

        image_url:null
      });

  if(error){

    alert("পোস্ট করা যায়নি: "+error.message);

    return;
  }

  document.getElementById("postText").value="";
  document.getElementById("postImage").value="";
  document.getElementById("imagePreview").style.display="none";

  loadPosts();
}


/* =========================
   LOAD POSTS
========================= */

async function loadPosts(){

  const loading =
    document.getElementById("loading");

  const postsBox =
    document.getElementById("posts");

  loading.style.display="block";

  postsBox.innerHTML="";

  const {data:posts,error} =
    await supabaseClient
      .from("posts")
      .select("*")
      .order("created_at",{ascending:false});

  loading.style.display="none";

  if(error){

    postsBox.innerHTML =
      `<div class="card">
        <div class="card-body">
          পোস্ট লোড করতে সমস্যা হয়েছে।
        </div>
      </div>`;

    console.log(error);

    return;
  }

  if(!posts || posts.length===0){

    postsBox.innerHTML =
      `<div class="card">
        <div class="empty">
          এখনো কোনো পোস্ট নেই।
        </div>
      </div>`;

    return;
  }

  for(const post of posts){

    await renderPost(post);
  }
}


/* =========================
   RENDER POST
========================= */

async function renderPost(post){

  const postsBox =
    document.getElementById("posts");

  const name =
    "ব্যবহারকারী";

  const card =
    document.createElement("div");

  card.className="card";

  let imageHTML="";

  if(post.image_url){

    imageHTML =
      `<img class="preview"
        src="${escapeHTML(post.image_url)}"
        alt="ছবি">`;
  }

  const {count:likeCount} =
    await supabaseClient
      .from("post_likes")
      .select("*",{count:"exact",head:true})
      .eq("post_id",post.id);

  let liked=false;

  if(currentUser){

    const {data:myLike} =
      await supabaseClient
        .from("post_likes")
        .select("post_id")
        .eq("post_id",post.id)
        .eq("user_id",currentUser.id)
        .maybeSingle();

    liked=!!myLike;
  }

  const {data:comments} =
    await supabaseClient
      .from("post_comments")
      .select("*")
      .eq("post_id",post.id)
      .order("created_at",{ascending:true});

  card.innerHTML=`

    <div class="card-body">

      <div class="profile">

        <div class="avatar">👤</div>

        <div>
          <div class="name">${name}</div>

          <div class="date">
            ${formatDate(post.created_at)}
          </div>
        </div>

      </div>

      ${
        post.content
        ? `<div style="white-space:pre-wrap;margin-bottom:10px">
            ${escapeHTML(post.content)}
           </div>`
        : ""
      }

      ${imageHTML}

      <div class="stats">
        <span>❤️ ${likeCount || 0} লাইক</span>
        <span>${comments?.length || 0} কমেন্ট</span>
      </div>

      <div class="actions">

        <button
          class="${liked ? "like-on":""}"
          onclick="toggleLike('${post.id}',this)">
          ❤️ লাইক
        </button>

        <button onclick="focusComment('${post.id}')">
          💬 কমেন্ট
        </button>

        <button onclick="sharePost('${post.id}')">
          📤 শেয়ার
        </button>

      </div>

      <div id="comments-${post.id}">
        ${renderComments(comments || [])}
      </div>

      ${
        currentUser
        ? `
        <div class="comment-box">

          <input
            id="comment-${post.id}"
            placeholder="কমেন্ট লিখুন...">

          <button
            class="primary"
            onclick="addComment('${post.id}')">
            পাঠান
          </button>

        </div>
        `
        : `
        <div style="text-align:center;color:#777;margin-top:12px">
          কমেন্ট করতে লগইন করুন।
        </div>
        `
      }

    </div>
  `;

  postsBox.appendChild(card);
}


/* =========================
   COMMENTS
========================= */

function renderComments(comments){

  if(!comments.length) return "";

  const top =
    comments.filter(c=>!c.parent_id);

  return top.map(c=>{

    const replies =
      comments.filter(r=>r.parent_id===c.id);

    return `

      <div class="comment">

        <div class="comment-name">
          👤 ব্যবহারকারী
        </div>

        <div class="comment-text">
          ${escapeHTML(c.content)}
        </div>

        ${
          currentUser
          ? `<span
              class="small"
              onclick="replyTo('${c.post_id}','${c.id}')">
              রিপ্লাই
             </span>`
          : ""
        }

        ${replies.map(r=>`

          <div class="comment reply">

            <div class="comment-name">
              👤 ব্যবহারকারী
            </div>

            <div class="comment-text">
              ${escapeHTML(r.content)}
            </div>

          </div>

        `).join("")}

      </div>

    `;

  }).join("");
}


async function addComment(postId){

  if(!currentUser){

    openLogin();
    return;
  }

  const input =
    document.getElementById("comment-"+postId);

  const text =
    input.value.trim();

  if(!text) return;

  const {error} =
    await supabaseClient
      .from("post_comments")
      .insert({

        post_id:postId,

        user_id:currentUser.id,

        content:text,

        parent_id:null
      });

  if(error){

    alert("কমেন্ট করা যায়নি: "+error.message);

    return;
  }

  input.value="";

  loadPosts();
}


async function replyTo(postId,parentId){

  if(!currentUser){

    openLogin();
    return;
  }

  const text =
    prompt("রিপ্লাই লিখুন:");

  if(!text || !text.trim()) return;

  const {error} =
    await supabaseClient
      .from("post_comments")
      .insert({

        post_id:postId,

        user_id:currentUser.id,

        content:text.trim(),

        parent_id:parentId
      });

  if(error){

    alert("রিপ্লাই করা যায়নি: "+error.message);

    return;
  }

  loadPosts();
}


/* =========================
   LIKE
========================= */

async function toggleLike(postId,button){

  if(!currentUser){

    openLogin();
    return;
  }

  const {data:existing} =
    await supabaseClient
      .from("post_likes")
      .select("*")
      .eq("post_id",postId)
      .eq("user_id",currentUser.id)
      .maybeSingle();

  if(existing){

    await supabaseClient
      .from("post_likes")
      .delete()
      .eq("post_id",postId)
      .eq("user_id",currentUser.id);

  }else{

    await supabaseClient
      .from("post_likes")
      .insert({

        post_id:postId,

        user_id:currentUser.id
      });
  }

  loadPosts();
}


/* =========================
   SHARE
========================= */

async function sharePost(postId){

  const url =
    window.location.origin +
    window.location.pathname +
    "?post=" +
    postId;

  if(navigator.share){

    try{

      await navigator.share({

        title:"ওমর এস এস ঘর",

        text:"এই পোস্টটি দেখুন",

        url:url
      });

    }catch(e){}

  }else{

    try{

      await navigator.clipboard.writeText(url);

      alert("পোস্টের লিংক কপি হয়েছে।");

    }catch(e){

      prompt("এই লিংকটি কপি করুন:",url);
    }
  }
}


/* =========================
   HELPERS
========================= */

function focusComment(postId){

  const input =
    document.getElementById("comment-"+postId);

  if(input){

    input.focus();

    input.scrollIntoView({
      behavior:"smooth",
      block:"center"
    });

  }else{

    openLogin();
  }
}


function formatDate(date){

  return new Date(date)
    .toLocaleString("bn-BD",{
      dateStyle:"medium",
      timeStyle:"short"
    });
}


function escapeHTML(value){

  if(value===null || value===undefined)
    return "";

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================
   START
========================= */

supabaseClient.auth
  .onAuthStateChange(
    async (event,session)=>{

      currentUser =
        session?.user || null;

      updateUI();

      if(event==="SIGNED_IN" ||
         event==="SIGNED_OUT"){

        loadPosts();
      }
    }
  );


(async function(){

  await loadUser();

  await loadPosts();

})();
</script>

</body>
</html>
