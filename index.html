<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ওমর এস এস ঘর</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#f0f2f5;
 font-family:Arial,"Noto Sans Bengali",sans-serif;
 color:#222
}
header{
 position:sticky;
 top:0;
 z-index:10;
 background:#fff;
 padding:12px 15px;
 border-bottom:1px solid #ddd;
 display:flex;
 justify-content:space-between;
 align-items:center;
 box-shadow:0 1px 5px #0001
}
.logo{font-size:20px;font-weight:bold}
.container{max-width:700px;margin:15px auto;padding:0 10px}
.card{
 background:#fff;
 border-radius:12px;
 margin-bottom:15px;
 padding:15px;
 box-shadow:0 1px 5px #0001
}
.profile{display:flex;gap:10px;align-items:center}
.avatar{
 width:42px;height:42px;border-radius:50%;
 background:#1877f2;color:white;
 display:flex;align-items:center;justify-content:center;
 font-weight:bold
}
.name{font-weight:bold}
.date{font-size:12px;color:#777;margin-top:3px}
textarea,input{
 width:100%;
 border:1px solid #ccd0d5;
 border-radius:9px;
 padding:12px;
 font-size:15px;
 margin-bottom:10px
}
textarea{min-height:85px;resize:vertical}
button{
 border:0;
 border-radius:8px;
 padding:10px 15px;
 font-size:15px;
 cursor:pointer
}
.primary{background:#1877f2;color:#fff}
.danger{background:#e41e3f;color:#fff}
.gray{background:#e4e6eb}
.post-image{
 width:100%;
 max-height:600px;
 object-fit:cover;
 border-radius:9px;
 margin-top:8px
}
.actions{
 display:flex;
 gap:5px;
 border-top:1px solid #eee;
 margin-top:12px;
 padding-top:8px
}
.actions button{flex:1;background:#fff}
.actions button:hover{background:#f0f2f5}
.liked{color:#1877f2;font-weight:bold}
.stats{
 display:flex;
 justify-content:space-between;
 color:#777;
 font-size:13px;
 margin-top:10px
}
.comment{
 background:#f0f2f5;
 border-radius:15px;
 padding:9px 12px;
 margin-top:8px
}
.reply{margin-left:30px}
.comment-name{font-weight:bold;font-size:14px}
.comment-text{margin-top:3px;word-break:break-word}
.comment-form{
 display:flex;
 gap:6px;
 margin-top:10px
}
.comment-form input{margin:0}
.small{
 color:#1877f2;
 font-size:12px;
 cursor:pointer;
 margin-left:8px
}
.modal{
 display:none;
 position:fixed;
 inset:0;
 background:#0008;
 z-index:50;
 align-items:center;
 justify-content:center;
 padding:15px
}
.modal-box{
 background:white;
 width:100%;
 max-width:420px;
 border-radius:14px;
 padding:20px
}
.close{
 float:right;
 font-size:25px;
 cursor:pointer
}
.status{
 background:#f0f2f5;
 padding:10px;
 border-radius:8px;
 margin-bottom:10px;
 font-size:14px
}
.loading{text-align:center;padding:25px;color:#666}
.preview{
 width:100%;
 max-height:350px;
 object-fit:cover;
 border-radius:9px;
 margin-bottom:10px
}
@media(max-width:600px){
 .logo{font-size:17px}
 header{padding:10px}
}
</style>
</head>

<body>

<header>
 <div class="logo">🏪 ওমর এস এস ঘর</div>

 <div>
   <span id="userName" style="margin-right:6px"></span>

   <button id="loginBtn" class="primary" onclick="openAuth()">
     লগইন
   </button>

   <button id="logoutBtn" class="danger"
           onclick="logout()" style="display:none">
     লগআউট
   </button>
 </div>
</header>

<div class="container">

 <!-- পোস্ট তৈরি -->
 <div class="card">

   <div id="loginNotice" class="status">
     পোস্ট করতে লগইন করুন।
   </div>

   <div id="postCreator" style="display:none">

     <textarea id="postText"
       placeholder="আপনার মনের কথা লিখুন..."></textarea>

     <input
       type="file"
       id="postImage"
       accept="image/*"
       onchange="showPreview(event)">

     <img id="preview"
          class="preview"
          style="display:none">

     <button class="primary"
             style="width:100%"
             onclick="createPost()">
       📤 পোস্ট করুন
     </button>

   </div>

 </div>

 <div id="loading" class="loading">
   পোস্ট লোড হচ্ছে...
 </div>

 <div id="posts"></div>

</div>


<!-- লগইন / রেজিস্ট্রেশন -->

<div class="modal" id="authModal">

 <div class="modal-box">

   <span class="close" onclick="closeAuth()">×</span>

   <h2 id="authTitle">লগইন</h2>

   <input id="authName"
          placeholder="আপনার নাম"
          style="display:none">

   <input id="authEmail"
          type="email"
          placeholder="ইমেইল">

   <input id="authPassword"
          type="password"
          placeholder="পাসওয়ার্ড">

   <button class="primary"
           style="width:100%"
           onclick="submitAuth()">
     <span id="authButton">লগইন</span>
   </button>

   <p style="text-align:center">
     <span id="switchLabel">নতুন সদস্য?</span>
     <span class="small"
           onclick="switchAuth()"
           id="switchButton">
       রেজিস্ট্রেশন করুন
     </span>
   </p>

   <div id="authMessage"
        class="status"
        style="display:none">
   </div>

 </div>
</div>


<script>

/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
"https://gzujcqjpxypcoiqhpvvu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3A5P427eZte1-uOzytOYSA_4bviRFcF";

const supabaseClient =
window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);


/*
  গুরুত্বপূর্ণ:
  এই নামেই Supabase Storage Bucket
  তৈরি থাকতে হবে।
*/
const IMAGE_BUCKET = "post-images";


let currentUser = null;
let registerMode = false;


/* ================================
   AUTH
================================ */

async function loadUser(){

 const {data} =
   await supabaseClient.auth.getUser();

 currentUser = data?.user || null;

 updateUI();
}


function updateUI(){

 const userName =
   document.getElementById("userName");

 const loginBtn =
   document.getElementById("loginBtn");

 const logoutBtn =
   document.getElementById("logoutBtn");

 const notice =
   document.getElementById("loginNotice");

 const creator =
   document.getElementById("postCreator");


 if(currentUser){

   const name =
     currentUser.user_metadata?.full_name ||
     currentUser.email?.split("@")[0] ||
     "ব্যবহারকারী";

   userName.textContent = name;

   loginBtn.style.display="none";
   logoutBtn.style.display="inline-block";

   notice.style.display="none";
   creator.style.display="block";

 }else{

   userName.textContent="";

   loginBtn.style.display="inline-block";
   logoutBtn.style.display="none";

   notice.style.display="block";
   creator.style.display="none";
 }
}


function openAuth(){

 registerMode=false;

 document.getElementById("authModal")
   .style.display="flex";

 updateAuth();
}


function closeAuth(){

 document.getElementById("authModal")
   .style.display="none";
}


function switchAuth(){

 registerMode=!registerMode;

 updateAuth();
}


function updateAuth(){

 document.getElementById("authTitle").textContent =
   registerMode
   ? "নতুন অ্যাকাউন্ট"
   : "লগইন";

 document.getElementById("authButton").textContent =
   registerMode
   ? "রেজিস্ট্রেশন করুন"
   : "লগইন";

 document.getElementById("authName").style.display =
   registerMode
   ? "block"
   : "none";

 document.getElementById("switchLabel").textContent =
   registerMode
   ? "আগে থেকেই অ্যাকাউন্ট আছে?"
   : "নতুন সদস্য?";

 document.getElementById("switchButton").textContent =
   registerMode
   ? "লগইন করুন"
   : "রেজিস্ট্রেশন করুন";
}


async function submitAuth(){

 const name =
   document.getElementById("authName").value.trim();

 const email =
   document.getElementById("authEmail").value.trim();

 const password =
   document.getElementById("authPassword").value;

 const msg =
   document.getElementById("authMessage");

 msg.style.display="block";


 if(!email || !password){

   msg.textContent =
     "ইমেইল ও পাসওয়ার্ড দিন।";

   return;
 }


 if(registerMode){

   if(!name){

     msg.textContent =
       "আপনার নাম লিখুন।";

     return;
   }


   const {error} =
     await supabaseClient.auth.signUp({

       email:email,
       password:password,

       options:{
         data:{
           full_name:name
         }
       }

     });


   if(error){

     msg.textContent =
       "রেজিস্ট্রেশন হয়নি: "+error.message;

     return;
   }


   msg.textContent =
     "রেজিস্ট্রেশন সফল হয়েছে। ইমেইল যাচাই করতে হতে পারে।";


 }else{

   const {data,error} =
     await supabaseClient.auth.signInWithPassword({

       email:email,
       password:password

     });


   if(error){

     msg.textContent =
       "লগইন হয়নি: "+error.message;

     return;
   }


   currentUser=data.user;

   closeAuth();

   updateUI();

   loadPosts();
 }
}


async function logout(){

 await supabaseClient.auth.signOut();

 currentUser=null;

 updateUI();

 loadPosts();
}


/* ================================
   IMAGE PREVIEW
================================ */

function showPreview(event){

 const file =
   event.target.files[0];

 const preview =
   document.getElementById("preview");


 if(!file){

   preview.style.display="none";

   return;
 }


 if(!file.type.startsWith("image/")){

   alert("শুধু ছবি নির্বাচন করুন।");

   event.target.value="";

   return;
 }


 if(file.size > 6 * 1024 * 1024){

   alert("ছবির আকার ৬ MB-এর মধ্যে রাখুন।");

   event.target.value="";

   return;
 }


 const reader =
   new FileReader();


 reader.onload=function(e){

   preview.src=e.target.result;

   preview.style.display="block";
 };


 reader.readAsDataURL(file);
}


/* ================================
   CREATE POST
================================ */

async function createPost(){

 if(!currentUser){

   openAuth();

   return;
 }


 const text =
   document.getElementById("postText")
   .value.trim();

 const file =
   document.getElementById("postImage")
   .files[0];


 if(!text && !file){

   alert("লেখা অথবা ছবি দিন।");

   return;
 }


 let imageURL=null;


 /* ছবি আপলোড */

 if(file){

   const extension =
     file.name.split(".").pop()
     .toLowerCase();

   const fileName =
     currentUser.id +
     "/" +
     crypto.randomUUID() +
     "." +
     extension;


   const {data,error} =
     await supabaseClient.storage
       .from(IMAGE_BUCKET)
       .upload(
         fileName,
         file,
         {
           contentType:file.type,
           upsert:false
         }
       );


   if(error){

     alert(
       "ছবি আপলোড হয়নি।\n\n"+
       error.message+
       "\n\nSupabase Storage-এ "+
       "'post-images' নামে bucket আছে কি না দেখুন।"
     );

     return;
   }


   const publicURL =
     supabaseClient.storage
       .from(IMAGE_BUCKET)
       .getPublicUrl(data.path);


   imageURL =
     publicURL.data.publicUrl;
 }


 /* পোস্ট ডাটাবেজে */

 const {error} =
   await supabaseClient
     .from("posts")
     .insert({

       user_id:currentUser.id,

       content:text,

       image_url:imageURL

     });


 if(error){

   alert(
     "পোস্ট করা যায়নি: "+
     error.message
   );

   return;
 }


 document.getElementById("postText")
   .value="";

 document.getElementById("postImage")
   .value="";

 document.getElementById("preview")
   .style.display="none";


 loadPosts();
}


/* ================================
   LOAD POSTS
================================ */

async function loadPosts(){

 const loading =
   document.getElementById("loading");

 const box =
   document.getElementById("posts");


 loading.style.display="block";

 box.innerHTML="";


 const {data,error} =
   await supabaseClient
     .from("posts")
     .select("*")
     .order(
       "created_at",
       {ascending:false}
     );


 loading.style.display="none";


 if(error){

   box.innerHTML=
     `<div class="card">
       পোস্ট লোড করতে সমস্যা হয়েছে।
     </div>`;

   console.log(error);

   return;
 }


 if(!data || data.length===0){

   box.innerHTML=
     `<div class="card"
           style="text-align:center;color:#777">
       এখনো কোনো পোস্ট নেই।
     </div>`;

   return;
 }


 for(const post of data){

   await renderPost(post);
 }
}


/* ================================
   RENDER POST
================================ */

async function renderPost(post){

 const box =
   document.getElementById("posts");


 const card =
   document.createElement("div");

 card.className="card";


 const name =
   "ব্যবহারকারী";


 /* লাইক */

 const {count:likeCount} =
   await supabaseClient
     .from("post_likes")
     .select("*",{count:"exact",head:true})
     .eq("post_id",post.id);


 let liked=false;


 if(currentUser){

   const {data:like} =
     await supabaseClient
       .from("post_likes")
       .select("post_id")
       .eq("post_id",post.id)
       .eq("user_id",currentUser.id)
       .maybeSingle();

   liked=!!like;
 }


 /* কমেন্ট */

 const {data:comments} =
   await supabaseClient
     .from("post_comments")
     .select("*")
     .eq("post_id",post.id)
     .order(
       "created_at",
       {ascending:true}
     );


 let imageHTML="";


 if(post.image_url){

   imageHTML=
     `<img
       class="post-image"
       src="${escapeHTML(post.image_url)}"
       alt="পোস্টের ছবি"
       loading="lazy">`;
 }


 card.innerHTML=`

   <div class="profile">

     <div class="avatar">👤</div>

     <div>

       <div class="name">
         ${name}
       </div>

       <div class="date">
         ${formatDate(post.created_at)}
       </div>

     </div>

   </div>


   ${
     post.content
     ?
     `<div style="
       margin-top:12px;
       white-space:pre-wrap;
       word-break:break-word">
       ${escapeHTML(post.content)}
      </div>`
     :
     ""
   }


   ${imageHTML}


   <div class="stats">

     <span>
       ❤️ ${likeCount || 0} লাইক
     </span>

     <span>
       ${comments?.length || 0} কমেন্ট
     </span>

   </div>


   <div class="actions">

     <button
       class="${liked ? "liked":""}"
       onclick="toggleLike('${post.id}')">
       ❤️ লাইক
     </button>

     <button
       onclick="focusComment('${post.id}')">
       💬 কমেন্ট
     </button>

     <button
       onclick="sharePost('${post.id}')">
       📤 শেয়ার
     </button>

   </div>


   <div id="comments-${post.id}">
     ${renderComments(comments || [])}
   </div>


   ${
     currentUser
     ?
     `<div class="comment-form">

       <input
         id="comment-${post.id}"
         placeholder="কমেন্ট লিখুন...">

       <button
         class="primary"
         onclick="addComment('${post.id}')">
         পাঠান
       </button>

      </div>`
     :
     `<div style="
       text-align:center;
       color:#777;
       margin-top:12px">
       কমেন্ট করতে লগইন করুন।
      </div>`
   }

 `;


 box.appendChild(card);
}


/* ================================
   COMMENTS
================================ */

function renderComments(comments){

 if(!comments.length)
   return "";


 const top =
   comments.filter(c=>!c.parent_id);


 return top.map(comment=>{

   const replies =
     comments.filter(
       r=>r.parent_id===comment.id
     );


   return `

     <div class="comment">

       <div class="comment-name">
         👤 ব্যবহারকারী
       </div>

       <div class="comment-text">
         ${escapeHTML(comment.content)}
       </div>

       ${
         currentUser
         ?
         `<span
           class="small"
           onclick="
             replyTo(
               '${comment.post_id}',
               '${comment.id}'
             )">
           ↩️ রিপ্লাই
          </span>`
         :
         ""
       }


       ${
         replies.map(reply=>`

           <div class="comment reply">

             <div class="comment-name">
               👤 ব্যবহারকারী
             </div>

             <div class="comment-text">
               ${escapeHTML(reply.content)}
             </div>

           </div>

         `).join("")
       }

     </div>

   `;

 }).join("");
}


/* ================================
   ADD COMMENT
================================ */

async function addComment(postId){

 if(!currentUser){

   openAuth();

   return;
 }


 const input =
   document.getElementById(
     "comment-"+postId
   );


 const text =
   input.value.trim();


 if(!text) return;


 const {error} =
   await supabaseClient
     .from("post_comments")
     .insert({

       post_id:postId,

       user_id:currentUser.id,

       content:text,

       parent_id:null
     });


 if(error){

   alert(
     "কমেন্ট করা যায়নি: "+
     error.message
   );

   return;
 }


 input.value="";

 loadPosts();
}


/* ================================
   REPLY
================================ */

async function replyTo(
 postId,
 parentId
){

 if(!currentUser){

   openAuth();

   return;
 }


 const text =
   prompt("রিপ্লাই লিখুন:");


 if(!text || !text.trim())
   return;


 const {error} =
   await supabaseClient
     .from("post_comments")
     .insert({

       post_id:postId,

       user_id:currentUser.id,

       content:text.trim(),

       parent_id:parentId
     });


 if(error){

   alert(
     "রিপ্লাই করা যায়নি: "+
     error.message
   );

   return;
 }


 loadPosts();
}


/* ================================
   LIKE
================================ */

async function toggleLike(postId){

 if(!currentUser){

   openAuth();

   return;
 }


 const {data:existing} =
   await supabaseClient
     .from("post_likes")
     .select("post_id")
     .eq("post_id",postId)
     .eq("user_id",currentUser.id)
     .maybeSingle();


 if(existing){

   await supabaseClient
     .from("post_likes")
     .delete()
     .eq("post_id",postId)
     .eq("user_id",currentUser.id);

 }else{

   await supabaseClient
     .from("post_likes")
     .insert({

       post_id:postId,

       user_id:currentUser.id
     });
 }


 loadPosts();
}


/* ================================
   SHARE
================================ */

async function sharePost(postId){

 const url =
   window.location.origin+
   window.location.pathname+
   "?post="+postId;


 if(navigator.share){

   try{

     await navigator.share({

       title:"ওমর এস এস ঘর",

       text:"এই পোস্টটি দেখুন",

       url:url

     });

   }catch(e){}

 }else{

   try{

     await navigator.clipboard.writeText(url);

     alert(
       "পোস্টের লিংক কপি হয়েছে।"
     );

   }catch(e){

     prompt(
       "লিংক কপি করুন:",
       url
     );
   }
 }
}


/* ================================
   HELPERS
================================ */

function focusComment(postId){

 const input =
   document.getElementById(
     "comment-"+postId
   );


 if(input){

   input.focus();

   input.scrollIntoView({
     behavior:"smooth",
     block:"center"
   });

 }else{

   openAuth();
 }
}


function formatDate(date){

 return new Date(date)
   .toLocaleString(
     "bn-BD",
     {
       dateStyle:"medium",
       timeStyle:"short"
     }
   );
}


function escapeHTML(value){

 if(value===null ||
    value===undefined)
   return "";

 return String(value)
   .replace(/&/g,"&amp;")
   .replace(/</g,"&lt;")
   .replace(/>/g,"&gt;")
   .replace(/"/g,"&quot;")
   .replace(/'/g,"&#039;");
}


/* ================================
   AUTH EVENT
================================ */

supabaseClient.auth
 .onAuthStateChange(
   (event,session)=>{

     currentUser =
       session?.user || null;

     updateUI();

     if(
       event==="SIGNED_IN" ||
       event==="SIGNED_OUT"
     ){

       loadPosts();
     }
   }
 );


/* ================================
   START
================================ */

(async function(){

 await loadUser();

 await loadPosts();

})();

</script>

</body>
</html>
