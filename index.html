<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ওমর এস এস ঘর | Customer Management</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans Bengali","Segoe UI",sans-serif;
  background:#f4f7f9;
  color:#172033;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.app{
  max-width:760px;
  margin:auto;
  min-height:100vh;
  padding-bottom:35px;
}

/* HEADER */
.header{
  background:linear-gradient(135deg,#087f5b,#0b9f72,#087f5b);
  color:white;
  padding:25px 20px 28px;
  border-radius:0 0 30px 30px;
  box-shadow:0 8px 25px #087f5b35;
}
.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
}
.brand-icon{
  width:54px;
  height:54px;
  border-radius:18px;
  background:#ffffff25;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
}
.brand h1{
  margin:0;
  font-size:25px;
}
.brand p{
  margin:3px 0 0;
  opacity:.9;
  font-size:13px;
}
.menu-btn{
  width:48px;
  height:48px;
  border-radius:50%;
  background:#ffffff28;
  color:white;
  font-size:25px;
}

/* CONTENT */
.content{padding:20px 16px}
.welcome{
  background:linear-gradient(135deg,#d5f8e9,#b8efd9);
  border-radius:25px;
  padding:23px;
  margin-bottom:18px;
  box-shadow:0 7px 20px #0b9f7220;
}
.welcome small{color:#087f5b;font-weight:700}
.welcome h2{margin:5px 0;font-size:28px}
.welcome p{margin:0;color:#41605a}

.section{
  background:white;
  border-radius:25px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 7px 22px #17203310;
}
.section-title{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}
.section-title .icon{
  width:43px;
  height:43px;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:22px;
}
.section-title h3{margin:0;font-size:22px}
.section-title p{margin:2px 0 0;color:#718096;font-size:13px}

/* COLOR BUTTONS */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}
.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.action{
  min-height:115px;
  border-radius:20px;
  padding:15px;
  color:white;
  text-align:left;
  box-shadow:0 8px 18px #00000018;
  transition:.15s;
}
.action:active{transform:scale(.97)}
.action .ico{font-size:30px}
.action b{
  display:block;
  font-size:16px;
  margin-top:7px;
}
.action small{
  display:block;
  margin-top:4px;
  opacity:.9;
  line-height:1.35;
}
.green{background:linear-gradient(135deg,#079b70,#16b981)}
.blue{background:linear-gradient(135deg,#1877d2,#2696e8)}
.purple{background:linear-gradient(135deg,#7251d8,#9861e8)}
.orange{background:linear-gradient(135deg,#f08b0b,#ffad22)}
.red{background:linear-gradient(135deg,#e53955,#f45c70)}
.teal{background:linear-gradient(135deg,#079da0,#18bfc0)}
.indigo{background:linear-gradient(135deg,#315ca9,#4681ce)}
.pink{background:linear-gradient(135deg,#df477e,#f2669a)}
.dark{background:linear-gradient(135deg,#27364b,#40556d)}

/* FORM */
.card{
  background:white;
  border-radius:25px;
  padding:20px;
  box-shadow:0 7px 22px #17203310;
}
label{
  display:block;
  font-weight:700;
  margin:13px 0 7px;
}
input,select,textarea{
  width:100%;
  border:1px solid #dbe3e8;
  background:#f8fafb;
  padding:13px 14px;
  border-radius:14px;
  outline:none;
}
input:focus,select:focus,textarea:focus{
  border-color:#0b9f72;
  box-shadow:0 0 0 3px #0b9f7215;
}
textarea{min-height:90px;resize:vertical}
.primary{
  width:100%;
  margin-top:18px;
  padding:14px;
  border-radius:15px;
  background:linear-gradient(135deg,#087f5b,#11a873);
  color:white;
  font-weight:800;
}
.secondary{
  padding:12px 15px;
  border-radius:13px;
  background:#edf2f5;
  color:#334155;
  font-weight:700;
}
.back{
  margin-bottom:15px;
  background:#e8f6f0;
  color:#087f5b;
}

/* CUSTOMER LIST */
.customer-item{
  display:flex;
  align-items:center;
  gap:12px;
  background:#f8fafb;
  border:1px solid #e4eaee;
  padding:15px;
  border-radius:18px;
  margin-bottom:10px;
}
.avatar{
  width:48px;
  height:48px;
  border-radius:16px;
  background:linear-gradient(135deg,#087f5b,#19b681);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  font-weight:800;
}
.customer-info{flex:1}
.customer-info b{font-size:17px}
.customer-info small{display:block;color:#718096;margin-top:3px}
.more{
  width:40px;
  height:40px;
  border-radius:12px;
  background:#e9eef2;
  font-size:20px;
}

/* DETAILS */
.hero-customer{
  background:linear-gradient(135deg,#087f5b,#11a873);
  color:white;
  border-radius:25px;
  padding:20px;
  margin-bottom:18px;
}
.hero-customer h2{margin:0 0 5px}
.hero-customer p{margin:4px 0;opacity:.9}

.info-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}
.info-box{
  background:#ffffff22;
  border-radius:15px;
  padding:11px;
}
.info-box small{display:block;opacity:.8}
.info-box b{font-size:16px}

.category{
  background:linear-gradient(135deg,#1877d2,#2696e8);
  color:white;
  border-radius:17px;
  padding:16px;
  margin-bottom:10px;
  font-weight:800;
  display:flex;
  justify-content:space-between;
}

/* TABLE / ITEMS */
.item{
  border:1px solid #e3e9ed;
  background:#fafcfd;
  border-radius:17px;
  padding:14px;
  margin-bottom:10px;
}
.item-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}
.amount{font-weight:900;color:#087f5b}
.muted{color:#718096;font-size:13px}
.total-box{
  background:linear-gradient(135deg,#ecfff7,#d8f9eb);
  border-radius:20px;
  padding:18px;
  margin-top:15px;
}
.total-line{
  display:flex;
  justify-content:space-between;
  padding:7px 0;
}
.total-line.final{
  border-top:1px solid #b9dfd0;
  margin-top:8px;
  padding-top:13px;
  font-size:19px;
  font-weight:900;
}
.profit{color:#087f5b}
.loss{color:#dc3545}

/* LOGIN */
.login-wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.login-card{
  width:100%;
  max-width:430px;
  background:white;
  padding:28px 22px;
  border-radius:28px;
  box-shadow:0 15px 45px #17203320;
}
.login-logo{
  width:75px;
  height:75px;
  margin:auto;
  border-radius:25px;
  background:linear-gradient(135deg,#087f5b,#11a873);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  color:white;
}
.login-card h1{text-align:center;margin:15px 0 5px}
.login-card p{text-align:center;color:#718096}

.notice{
  padding:13px 15px;
  border-radius:14px;
  margin-bottom:12px;
  background:#fff5db;
  color:#8a5a00;
}
.empty{
  text-align:center;
  padding:30px 15px;
  color:#718096;
}
.loading{text-align:center;padding:40px;color:#718096}

/* TOAST */
.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  background:#172033;
  color:white;
  padding:13px 20px;
  border-radius:15px;
  z-index:9999;
  display:none;
  max-width:90%;
  text-align:center;
}
.toast.show{display:block}

/* RESPONSIVE */
@media(max-width:520px){
  .grid3{grid-template-columns:repeat(2,1fr)}
  .action{min-height:105px}
}
</style>
</head>

<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
const SUPABASE_URL="https://gzujcqjpxypcoiqhpvvu.supabase.co";
const SUPABASE_KEY="sb_publishable_3A5P427eZte1-uOzytOYSA_4bviRFcF";

const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let session=null;
let user=null;
let services=[];
let permissions={};
let currentCustomer=null;

const app=document.getElementById("app");

function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2500);
}

function money(n){
  return Number(n||0).toLocaleString("bn-BD",{minimumFractionDigits:0,maximumFractionDigits:2})+" ৳";
}

function esc(v){
  return String(v??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function today(){
  return new Date().toISOString().slice(0,10);
}

function pageTitle(title,sub=""){
  return `
    <button class="secondary back" onclick="goHome()">← ফিরে যান</button>
    <div class="section-title">
      <div class="icon green">📋</div>
      <div>
        <h3>${title}</h3>
        ${sub?`<p>${sub}</p>`:""}
      </div>
    </div>
  `;
}

function goHome(){
  location.hash="#/";
}

function go(hash){
  location.hash=hash;
}

async function getAuth(){
  const {data}=await supabase.auth.getSession();
  session=data.session;
  user=session?.user||null;
}

async function loadServices(){
  const {data,error}=await supabase
    .from("platform_services")
    .select("*")
    .eq("is_active",true)
    .order("sort_order");

  if(!error) services=data||[];

  if(user){
    const {data:p}=await supabase
      .from("platform_service_permissions")
      .select("service_id,enabled,platform_services(service_key)")
      .eq("user_id",user.id);

    permissions={};

    (p||[]).forEach(x=>{
      if(x.platform_services){
        permissions[x.platform_services.service_key]=x.enabled;
      }
    });
  }
}

function serviceEnabled(key){
  const keys=Object.keys(permissions);
  if(keys.length===0) return true;
  return permissions[key]===true;
}

async function checkAccount(){
  if(!user) return true;

  const {data}=await supabase
    .from("platform_customer_accounts")
    .select("active,blocked_at,name,phone")
    .eq("user_id",user.id)
    .maybeSingle();

  if(data && data.active===false){
    app.innerHTML=`
      <div class="login-wrap">
        <div class="login-card">
          <div class="login-logo">🚫</div>
          <h1>Account Blocked</h1>
          <p>আপনার Account বর্তমানে বন্ধ করা হয়েছে।</p>
          <button class="primary" onclick="logout()">Logout</button>
        </div>
      </div>`;
    return false;
  }
  return true;
}

function loginPage(){
  app.innerHTML=`
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">🏪</div>
      <h1>ওমর এস এস ঘর</h1>
      <p>Customer Management Panel</p>

      <label>Email</label>
      <input id="loginEmail" type="email" placeholder="আপনার Email">

      <label>Password</label>
      <input id="loginPassword" type="password" placeholder="Password">

      <button class="primary" onclick="login()">Login</button>

      <div class="notice" style="margin-top:15px">
        আপনার Customer Account দিয়ে Login করুন।
      </div>
    </div>
  </div>`;
}

async function login(){
  const email=document.getElementById("loginEmail").value.trim();
  const password=document.getElementById("loginPassword").value;

  if(!email||!password){
    toast("Email এবং Password দিন");
    return;
  }

  const {error}=await supabase.auth.signInWithPassword({
    email,password
  });

  if(error){
    toast(error.message);
    return;
  }

  toast("Login সফল হয়েছে");
  location.hash="#/";
}

async function logout(){
  await supabase.auth.signOut();
  session=null;
  user=null;
  location.hash="#/";
}

function header(){
 return `
 <div class="header">
   <div class="header-row">
     <div class="brand">
       <div class="brand-icon">🏪</div>
       <div>
         <h1>ওমর এস এস ঘর</h1>
         <p>Customer Management Panel</p>
       </div>
     </div>
     <button class="menu-btn" onclick="go('#/profile')">☰</button>
   </div>
 </div>`;
}

 app.innerHTML=`
 ${header()}
 <div class="content">

   <div class="welcome">
     <small>স্বাগতম</small>
     <h2>Customer</h2>
     <p>আপনার কাজ ও কাস্টমার হিসাব এখান থেকে পরিচালনা করুন।</p>
   </div>

   <div class="section">
     <div class="section-title">
       <div class="icon blue">👥</div>
       <div>
         <h3>কাস্টমার</h3>

       </div>
     </div>

     <div class="grid">
       <button class="action green" onclick="go('#/customer-add')">

       </button>
     </div>
   </div>

   <div class="section">
     <div class="section-title">
       <div class="icon purple">👤</div>
       <div>
         <h3>আমার Account</h3>
         <p>আপনার প্রোফাইল ও সার্ভিস দেখুন</p>
       </div>
     </div>

     <div class="grid">
       <button class="action purple" onclick="go('#/profile')">
         <span class="ico">👤</span>
         <b>Profile</b>
         <small>আপনার প্রোফাইল</small>
       </button>

       <button class="action orange" onclick="go('#/services')">
         <span class="ico">⚙️</span>
         <b>My Services</b>
         <small>আমার সার্ভিসসমূহ</small>
       </button>
     </div>
   </div>

   <div class="section">
     <div class="section-title">
       <div class="icon teal">📋</div>
       <div>
         <h3>কাস্টমার হিসাব</h3>
         <p>Customer List থেকে একটি Customer খুলুন</p>
       </div>
     </div>

     <div class="notice">
       Customer List → ⋮ → Details চাপলে সম্পূর্ণ হিসাবের Page খুলবে।
     </div>
   </div>

   <div class="section">
     <button class="action red" style="width:100%;min-height:70px;text-align:center" onclick="logout()">
       <span class="ico">⏻</span>
       <b>Logout</b>
     </button>
   </div>

 </div>`;
}

async function customerAddPage(){
  const serviceOptions=services.map(s=>
    `<option value="${esc(s.name)}">${esc(s.name)}</option>`
  ).join("");

  app.innerHTML=`
  ${header()}
  <div class="content">
    <div class="card">
      ${pageTitle("Customer Add","নতুন Customer তৈরি করুন")}

      <label>Customer Name</label>
      <input id="cName" placeholder="কাস্টমারের নাম">

      <label>Phone Number</label>
      <input id="cPhone" type="tel" placeholder="মোবাইল নম্বর">

      <label>Address</label>
      <textarea id="cAddress" placeholder="কাস্টমারের ঠিকানা"></textarea>

      <label>কাজ / Service</label>
      <select id="cService">
        ${serviceOptions || "<option>SS / Glass Work</option>"}
      </select>

      <label>Contact Price / Final Price</label>
      <input id="cPrice" type="number" min="0" placeholder="চুক্তির মোট দাম">

      <label>Delivery Date</label>
      <input id="cDelivery" type="date" value="${today()}">

      <button class="primary" onclick="saveCustomer()">💾 Customer Save</button>
    </div>
  </div>`;
}

async function saveCustomer(){
  const name=document.getElementById("cName").value.trim();
  const phone=document.getElementById("cPhone").value.trim();
  const address=document.getElementById("cAddress").value.trim();
  const service=document.getElementById("cService").value;
  const price=Number(document.getElementById("cPrice").value||0);
  const delivery=document.getElementById("cDelivery").value;

  if(!name||!phone){
    toast("Customer Name এবং Phone দিন");
    return;
  }

  const {data,error}=await supabase
    .from("platform_customers")
    .insert({
      owner_user_id:user.id,
      name,
      phone,
      address,
      service_name:service,
      final_price:price,
      delivery_date:delivery||null
    })
    .select()
    .single();

  if(error){
    toast(error.message);
    return;
  }

  await supabase.from("platform_customer_history").insert({
    owner_user_id:user.id,
    customer_id:data.id,
    event_type:"customer_created",
    details:{name,phone,service}
  });

  toast("Customer তৈরি হয়েছে");
  go("#/customers");
}

async function customerListPage(){
  app.innerHTML=`
  ${header()}
  <div class="content">
    <div class="card">
      ${pageTitle("Customer List","আপনার সকল Customer")}
      <div id="customerList" class="loading">লোড হচ্ছে...</div>
    </div>
  </div>`;

  const {data,error}=await supabase
    .from("platform_customers")
    .select("*")
    .eq("owner_user_id",user.id)
    .order("created_at",{ascending:false});

  const box=document.getElementById("customerList");

  if(error){
    box.innerHTML=`<div class="notice">${esc(error.message)}</div>`;
    return;
  }

  if(!data?.length){
    box.innerHTML=`<div class="empty">এখনও কোনো Customer যোগ করা হয়নি।</div>`;
    return;
  }

  box.innerHTML=data.map(c=>`
    <div class="customer-item">
      <div class="avatar">${esc((c.name||"C").charAt(0))}</div>

      <div class="customer-info">
        <b>${esc(c.name)}</b>
        <small>📞 ${esc(c.phone)}</small>
        <small>💰 ${money(c.final_price)} · 📅 ${esc(c.delivery_date||"নির্ধারিত নয়")}</small>
      </div>

      <button class="more" onclick="customerMenu('${c.id}')">⋮</button>
    </div>
  `).join("");
}

function customerMenu(id){
  const old=document.getElementById("customerMenu");
  if(old) old.remove();

  const d=document.createElement("div");
  d.id="customerMenu";
  d.style.cssText=`
    position:fixed;inset:0;background:#17203355;
    z-index:5000;display:flex;align-items:flex-end;
    justify-content:center;padding:15px;
  `;

  d.innerHTML=`
    <div style="background:white;width:100%;max-width:500px;border-radius:25px;padding:20px">
      <h3 style="margin-top:0">Customer Options</h3>

      <button class="action green" style="width:100%;min-height:70px;margin-bottom:10px"
        onclick="closeMenu();go('#/customer/${id}')">
        📋 Details
      </button>

      <button class="secondary" style="width:100%" onclick="closeMenu()">Cancel</button>
    </div>`;

  document.body.appendChild(d);
}

function closeMenu(){
  document.getElementById("customerMenu")?.remove();
}

async function loadCustomer(id){
  const {data,error}=await supabase
    .from("platform_customers")
    .select("*")
    .eq("id",id)
    .eq("owner_user_id",user.id)
    .single();

  if(error||!data){
    toast("Customer পাওয়া যায়নি");
    go("#/customers");
    return null;
  }

  currentCustomer=data;
  return data;
}

async function customerDetailsPage(id){
  const c=await loadCustomer(id);
  if(!c)return;

  const buttons=[];

  if(serviceEnabled("payment")){
    buttons.push(`
      <button class="action green" onclick="go('#/customer/${id}/payment-add')">

function calcMaterial(){
  const qty=Number(document.getElementById("matQty")?.value||0);
  const price=Number(document.getElementById("matPrice")?.value||0);
  const total=qty*price;

  const el=document.getElementById("matTotal");
  if(el)el.textContent=money(total);
}

async function saveMaterial(customerId,categoryId){
  const name=document.getElementById("matName").value.trim();
  const qty=Number(document.getElementById("matQty").value||0);
  const price=Number(document.getElementById("matPrice").value||0);
  const total=qty*price;

  if(!name){
    toast("Material Name দিন");
    return;
  }

  if(qty<=0||price<0){
    toast("Quantity ও Price সঠিকভাবে দিন");
    return;
  }

  const {error}=await supabase
    .from("platform_materials")
    .insert({
      owner_user_id:user.id,
      customer_id:customerId,
      category_id:categoryId,
      name,
      price,
      quantity:qty,
      total
    });

  if(error){
    toast(error.message);
    return;
  }

  toast("Material যোগ হয়েছে");
  go("#/customer/"+customerId+"/materials");
}

        <input id="mRate" type="number" min="0"
          oninput="calcMistri()">
      </div>

      <div id="contractField" style="display:none">
        <label>চুক্তির মোট টাকা</label>
        <input id="mContract" type="number" min="0"
          oninput="calcMistri()">
      </div>

      <div class="total-box">
        <div class="total-line">
          <span>মিস্ত্রির মোট খরচ</span>

      </button>
    </div>
  </div>`;

function mistriTypeChange(){
  const type=document.getElementById("mType").value;

  document.getElementById("dailyFields").style.display=
    type==="daily"?"block":"none";

  document.getElementById("contractField").style.display=
    type==="contract"?"block":"none";

  calcMistri();
}

function calcMistri(){
  const type=document.getElementById("mType")?.value;
  let total=0;

  if(type==="daily"){
    total=
      Number(document.getElementById("mDays")?.value||0) *
      Number(document.getElementById("mRate")?.value||0);
  }else{
    total=Number(document.getElementById("mContract")?.value||0);
  }

  const el=document.getElementById("mTotal");
  if(el)el.textContent=money(total);
}

async function saveMistri(id){
  const name=document.getElementById("mName").value.trim();
  const date=document.getElementById("mDate").value;
  const site=document.getElementById("mSite").value.trim();
  const type=document.getElementById("mType").value;

  let days=0;
  let amount=0;

  if(type==="daily"){
    days=Number(document.getElementById("mDays").value||0);
    amount=days*Number(document.getElementById("mRate").value||0);
  }else{
    days=1;
    amount=Number(document.getElementById("mContract").value||0);
  }

  const comment=document.getElementById("mComment").value.trim();

  if(!name||amount<=0){
    toast("মিস্ত্রির নাম ও টাকা সঠিকভাবে দিন");
    return;
  }

  const finalComment=[
    site?`Site: ${site}`:"",
    type==="daily"?"দৈনিক":"চুক্তি",
    comment
  ].filter(Boolean).join(" | ");

  const {error}=await supabase
    .from("platform_mistri_entries")
    .insert({
      owner_user_id:user.id,
      customer_id:id,
      mistri_name:name,
      entry_date:date||today(),
      work_days:days,
      amount,
      comment:finalComment
    });

  if(error){
    toast(error.message);
    return;
  }

  toast("মিস্ত্রির হিসাব যোগ হয়েছে");
  go("#/customer/"+id+"/mistri-history");
}

          <span>বাকি Payment</span>
          <b>${money(Math.max(0,workTotal-paidTotal))}</b>
        </div>
      </div>

      <h3 style="margin-top:25px">👷 কাজের হিসাব</h3>

      ${
        !works.length
        ? `<div class="empty">কোনো মিস্ত্রি কাজ যোগ করা হয়নি।</div>`
        : works.map(w=>`
          <div class="item">
            <div class="item-top">
              <b>${esc(w.mistri_name)}</b>
              <span class="amount">${money(w.amount)}</span>
            </div>
            <div class="muted">
              📅 ${esc(w.entry_date)} · ${esc(w.work_days)} দিন
            </div>
            <div class="muted">${esc(w.comment||"")}</div>
          </div>
        `).join("")
      }

      <h3 style="margin-top:25px">💳 Payment History</h3>

      ${
        !pays.length
        ? `<div class="empty">কোনো মিস্ত্রি Payment নেই।</div>`
        : pays.map(p=>`
          <div class="item">
            <div class="item-top">
              <b>${esc(p.mistri_name)}</b>
              <span class="amount">${money(p.amount)}</span>
            </div>
            <div class="muted">📅 ${esc(p.payment_date)}</div>
            <div class="muted">${esc(p.comment||"")}</div>
          </div>
        `).join("")
      }
    </div>
  </div>`;
}

/* OTHER EXPENSE */
async function expensePage(id){
  const c=await loadCustomer(id);
  if(!c)return;

  app.innerHTML=`
  ${header()}
  <div class="content">
    <div class="card">
      ${pageTitle("অন্যান্য খরচ","Customer: "+c.name)}

      <label>Date</label>
      <input id="eDate" type="date" value="${today()}">

      <label>খরচের নাম</label>
      <input id="eName" placeholder="যেমন: Transport / খাবার / অন্যান্য">

      <label>Amount</label>
      <input id="eAmount" type="number" min="0" placeholder="খরচের টাকা">

      <label>Comment</label>
      <textarea id="eComment"></textarea>

      <button class="primary" onclick="saveExpense('${id}')">
        🧾 খরচ Save
      </button>
    </div>
  </div>`;
}

async function saveExpense(id){
  const date=document.getElementById("eDate").value;
  const name=document.getElementById("eName").value.trim();
  const amount=Number(document.getElementById("eAmount").value||0);
  const comment=document.getElementById("eComment").value.trim();

  if(!name||amount<=0){
    toast("খরচের নাম ও Amount দিন");
    return;
  }

  const {error}=await supabase
    .from("platform_other_expenses")
    .insert({
      owner_user_id:user.id,
      customer_id:id,
      expense_date:date||today(),
      name,
      amount,
      comment
    });

  if(error){
    toast(error.message);
    return;
  }

  toast("অন্যান্য খরচ যোগ হয়েছে");
  go("#/customer/"+id+"/summary");
}

/* SUMMARY */
async function summaryPage(id){
  const c=await loadCustomer(id);
  if(!c)return;

  const {data,error}=await supabase
    .rpc("platform_customer_summary",{p_customer_id:id});

  const s=data?.[0];

  if(error||!s){
    app.innerHTML=`
    ${header()}
    <div class="content">
      <div class="card">
        ${pageTitle("লাভ / ক্ষতি")}
        <div class="notice">${esc(error?.message||"হিসাব পাওয়া যায়নি")}</div>
      </div>
    </div>`;
    return;
  }

  const profit=Number(s.profit||0);

  app.innerHTML=`
  ${header()}
  <div class="content">
    <div class="card">
      ${pageTitle("লাভ / ক্ষতি",c.name)}

      <div class="total-box">

        <div class="total-line">
          <span>Customer Final Price</span>
          <b>${money(s.final_price)}</b>
        </div>

        <div class="total-line">
          <span>Customer থেকে জমা</span>
          <b>${money(s.paid)}</b>
        </div>

        <div class="total-line">
          <span>মাল খরচ</span>
          <b>${money(s.material_cost)}</b>
        </div>

        <div class="total-line">
          <span>মিস্ত্রি খরচ</span>
          <b>${money(s.mistri_cost)}</b>
        </div>

        <div class="total-line">
          <span>অন্যান্য খরচ</span>
          <b>${money(s.other_cost)}</b>
        </div>

        <div class="total-line">
          <span>মোট খরচ</span>
          <b>${money(s.total_cost)}</b>
        </div>

        <div class="total-line final">
          <span>${profit>=0?"লাভ":"ক্ষতি"}</span>
          <b class="${profit>=0?"profit":"loss"}">${money(Math.abs(profit))}</b>
        </div>

      </div>

      <div class="notice" style="margin-top:15px">
        লাভ/ক্ষতি হিসাব = Final Price − (মাল + মিস্ত্রি + অন্যান্য খরচ)
      </div>

      <button class="action blue" style="width:100%;min-height:70px;margin-top:10px"
        onclick="go('#/customer/${id}')">
        ← Customer Details
      </button>
    </div>
  </div>`;
}

/* SERVICES */
async function servicesPage(){
  const rows=services.map(s=>{
    const enabled=serviceEnabled(s.service_key);
    return `
      <div class="item">
        <div class="item-top">
          <b>${esc(s.name)}</b>
          <span class="${enabled?"amount":"loss"}">
            ${enabled?"ON":"OFF"}
          </span>
        </div>
        <div class="muted">${esc(s.description||"")}</div>
      </div>`;
  }).join("");

  app.innerHTML=`
  ${header()}
  <div class="content">
    <div class="card">
      ${pageTitle("My Services","Admin যে Service চালু করেছেন")}

      ${rows||`<div class="empty">কোনো Service পাওয়া যায়নি।</div>`}

      <div class="notice">
        Service ON থাকলে সেটি Customer Details-এ ব্যবহার করা যাবে।
      </div>
    </div>
  </div>`;
}

/* ROUTER */
async function router(){
  await getAuth();

  if(!user){
    loginPage();
    return;
  }

  const ok=await checkAccount();
  if(!ok)return;

  await loadServices();

  const path=location.hash.replace(/^#/,"")||"/";
  const parts=path.split("/").filter(Boolean);

  if(parts.length===0){
    homePage();
    return;
  }

  if(parts[0]==="customer-add"){
    customerAddPage();
    return;
  }

  if(parts[0]==="customers"){
    customerListPage();
    return;
  }

  if(parts[0]==="profile"){
    profilePage();
    return;
  }

  if(parts[0]==="services"){
    servicesPage();
    return;
  }

  if(parts[0]==="customer" && parts[1]){
    const id=parts[1];

    if(parts.length===2){
      customerDetailsPage(id);
      return;
    }

    if(parts[2]==="info"){
      customerInfoPage(id);
      return;
    }

    if(parts[2]==="payment-add"){
      paymentAddPage(id);
      return;
    }

    if(parts[2]==="payments"){
      paymentHistoryPage(id);
      return;
    }

    if(parts[2]==="material-add"){
      materialAddPage(id);
      return;
    }

    if(parts[2]==="materials"){
      materialsPage(id);
      return;
    }

    if(parts[2]==="category" && parts[3]){
      categoryPage(id,parts[3]);
      return;
    }

    if(parts[2]==="mistri-add"){
      mistriAddPage(id);
      return;
    }

    if(parts[2]==="mistri-payment"){
      mistriPaymentPage(id);
      return;
    }

    if(parts[2]==="mistri-history"){
      mistriHistoryPage(id);
      return;
    }

    if(parts[2]==="expense"){
      expensePage(id);
      return;
    }

    if(parts[2]==="summary"){
      summaryPage(id);
      return;
    }
  }

  homePage();
}

window.addEventListener("hashchange",router);

supabase.auth.onAuthStateChange((_event,_session)=>{
  session=_session;
  user=_session?.user||null;
});

router();
</script>
