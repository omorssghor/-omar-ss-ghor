<!doctype html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ওমর এস এস ঘর | মাল বিক্রি</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans Bengali",Arial,sans-serif;
  background:#f3f6f8;
  color:#18232d;
}

button,input,select,textarea{font:inherit}
button{border:0;cursor:pointer}

.top{
  position:sticky;
  top:0;
  z-index:20;
  background:#102027;
  color:#fff;
  padding:12px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.brand{font-weight:900}

.mini{
  font-size:11px;
  color:#748188;
}

.top .mini{color:#c8d2d5}

.content{
  max-width:1100px;
  margin:auto;
  padding:14px 12px 55px;
}

.title{
  font-size:23px;
  font-weight:900;
  margin:8px 0 14px;
}

.grid{
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:12px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:15px;
  box-shadow:0 8px 25px rgba(16,32,39,.09);
  margin-bottom:12px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}

.full{grid-column:1/-1}

label{
  display:block;
  font-size:12px;
  font-weight:800;
  margin-bottom:5px;
}

input,select,textarea{
  width:100%;
  padding:10px 11px;
  border:1px solid #d5dfe3;
  border-radius:10px;
  background:#fff;
}

input:focus,select:focus,textarea:focus{
  outline:0;
  border-color:#2674c9;
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:10px;
}

.btn{
  padding:7px 10px;
  border-radius:9px;
  background:#102027;
  color:#fff;
  font-weight:800;
  font-size:12px;
}

.btn.green{background:#15966b}
.btn.blue{background:#2674c9}
.btn.red{background:#dc4c4c}
.btn.light{background:#edf2f4;color:#26353c}
.btn.gold{background:#9a6b12}

.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.stat{
  background:#f4f7f8;
  padding:10px;
  border-radius:10px;
}

.stat small{
  display:block;
  color:#748188;
}

.stat b{
  display:block;
  font-size:18px;
  margin-top:3px;
}

.sale-row{
  display:grid;
  grid-template-columns:1.5fr .8fr .65fr .9fr auto;
  gap:7px;
  align-items:end;
  margin-bottom:8px;
}

.list{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.item{
  background:#fff;
  border-radius:12px;
  padding:11px;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:center;
}

.name{font-weight:900}

.sub{
  font-size:12px;
  color:#748188;
  margin-top:3px;
}

.right{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.badge{
  display:inline-block;
  padding:4px 7px;
  border-radius:20px;
  font-size:11px;
  font-weight:800;
  background:#edf2f4;
}

.badge.red{
  background:#ffe7e7;
  color:#b22e2e;
}

.badge.green{
  background:#ddf7ed;
  color:#08794f;
}

.empty{
  text-align:center;
  padding:22px;
  color:#7a878c;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px;
  z-index:50;
}

.modal-box{
  background:#fff;
  width:min(900px,100%);
  max-height:92vh;
  overflow:auto;
  border-radius:18px;
  padding:18px;
  position:relative;
}

.close{
  position:absolute;
  right:10px;
  top:10px;
  width:32px;
  height:32px;
  border-radius:50%;
  background:#edf2f4;
}

.hidden{display:none!important}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:8px;
  border-bottom:1px solid #e5eaec;
  font-size:12px;
  text-align:left;
}

th{background:#f4f7f8}

.perm{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:9px 0;
  border-bottom:1px solid #edf1f2;
}

.perm:last-child{border-bottom:0}

.switch{
  position:relative;
  width:43px;
  height:24px;
  flex:none;
}

.switch input{display:none}

.slider{
  position:absolute;
  inset:0;
  background:#cbd5d8;
  border-radius:20px;
  cursor:pointer;
}

.slider:before{
  content:"";
  position:absolute;
  width:18px;
  height:18px;
  left:3px;
  top:3px;
  background:#fff;
  border-radius:50%;
  transition:.2s;
}

.switch input:checked+.slider{
  background:#15966b;
}

.switch input:checked+.slider:before{
  transform:translateX(19px);
}

.userbox{
  border:1px solid #e3eaed;
  border-radius:12px;
  padding:10px;
  margin:8px 0;
}

.note{
  background:#f7fafb;
  border-left:4px solid #2674c9;
  padding:10px;
  border-radius:8px;
  font-size:12px;
}

@media(max-width:700px){

  .grid{
    grid-template-columns:1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .sale-row{
    grid-template-columns:1fr 1fr;
  }

  .summary{
    grid-template-columns:1fr 1fr;
  }

  .item{
    align-items:flex-start;
  }

  .top{
    align-items:flex-start;
  }

  .title{
    font-size:20px;
  }
}
</style>
</head>

<body>

<div class="top">

  <div>
    <div class="brand">🏪 ওমর এস এস ঘর</div>
    <div class="mini">🔩 মাল বিক্রি · ব্যক্তিগত ইউজার হিসাব</div>
  </div>

  <div class="actions" style="margin:0">

    <button
      class="btn light"
      onclick="location.href='index.html'">
      ← মূল হিসাব
    </button>

    <button
      id="permBtn"
      class="btn gold hidden"
      onclick="openPermissions()">
      ⚙️ Permission
    </button>

    <button
      class="btn red"
      onclick="logout()">
      Logout
    </button>

  </div>

</div>

<main class="content">

<div class="title">
  🔩 মাল বিক্রি
  <span class="mini">নগদ / বাকি / আংশিক</span>
</div>

<div id="loginBox" class="card">

  <b>🔐 Website Login প্রয়োজন</b>

  <p class="mini">
    আগে মূল Website-এ Login করুন।
    এখানে আলাদা Admin Login লাগবে না।
  </p>

  <div class="actions">

    <button
      class="btn blue"
      onclick="location.href='index.html'">
      মূল Website-এ Login
    </button>

  </div>

</div>

<div id="app" class="hidden">

<div id="permissionNote" class="note hidden"></div>

<div id="newSaleCard" class="card">

<h3>🧾 নতুন মাল বিক্রি</h3>

<div class="form-grid">

<div>
<label>ক্রেতার নাম</label>
<input
  id="buyerName"
  placeholder="নাম">
</div>

<div>
<label>মোবাইল</label>
<input
  id="buyerPhone"
  placeholder="মোবাইল">
</div>

<div class="full">
<label>ঠিকানা</label>
<input
  id="buyerAddress"
  placeholder="ঠিকানা">
</div>

<div>
<label>তারিখ</label>
<input
  id="saleDate"
  type="date">
</div>

<div>
<label>পেমেন্ট</label>

<select
  id="paymentType"
  onchange="paymentChanged()">

<option value="cash">নগদ</option>
<option value="credit">বাকি</option>
<option value="partial">আংশিক</option>

</select>

</div>

</div>

<div
  id="rows"
  style="margin-top:12px">
</div>

<div class="actions">

<button
  id="addRowBtn"
  class="btn light"
  onclick="addRow()">
  + মাল যোগ
</button>

</div>

<div
  class="summary"
  style="margin-top:12px">

<div class="stat">
<small>মোট</small>
<b id="saleTotal">৳0</b>
</div>

<div class="stat">
<small>জমা</small>
<b id="salePaid">৳0</b>
</div>

<div class="stat">
<small>বাকি</small>
<b id="saleDue">৳0</b>
</div>

</div>

<div
  id="paidWrap"
  style="margin-top:10px">

<label>এখন কত টাকা নিলেন</label>

<input
  id="paidNow"
  type="number"
  min="0"
  value="0"
  oninput="recalc()">

</div>

<div class="actions">

<button
  id="saveBtn"
  class="btn green"
  onclick="saveSale()">
  💾 বিক্রি Save
</button>

<button
  class="btn light"
  onclick="resetSale()">
  Clear
</button>

</div>

</div>

<div class="grid">

<section id="buyersCard" class="card">

<h3>👥 মাল কেনা ক্রেতা</h3>

<div id="buyerList"></div>

</section>

<section id="salesCard" class="card">

<h3>📋 বিক্রির ইতিহাস</h3>

<div id="saleList"></div>

</section>

</div>

</div>

</main>

<div
  id="modal"
  class="modal hidden"
  onclick="if(event.target===this)closeModal()">

<div class="modal-box">

<button
  class="close"
  onclick="closeModal()">
  ×
</button>

<div id="modalContent"></div>

</div>

</div>

<script>

const SUPABASE_URL =
"https://gzujcqjpxypcoiqhpvvu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3A5P427eZte1-uOzytOYSA_4bviRFcF";

const sb =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let user = null;
let adminId = null;
let isAdmin = false;
let materials = [];
let perm = {};

const money = n =>
  "৳" +
  Number(n || 0).toLocaleString(
    "en-US",
    {
      maximumFractionDigits:2
    }
  );

const esc = s =>
  String(s ?? "").replace(
    /[&<>'"]/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "'":"&#39;",
      '"':"&quot;"
    }[c])
  );

const today = () =>
  new Date().toISOString().slice(0,10);

const P = {

  can_view:
    "মাল বিক্রি পেজ দেখা",

  can_create_sale:
    "নতুন বিক্রি তৈরি",

  can_create_buyer:
    "নতুন ক্রেতা তৈরি",

  can_view_buyer:
    "ক্রেতার Details দেখা",

  can_view_history:
    "বিক্রির ইতিহাস দেখা",

  can_view_due:
    "বাকি দেখা",

  can_collect_due:
    "বাকি আদায়",

  can_edit_sale:
    "বিক্রি Edit",

  can_delete_sale:
    "বিক্রি Delete",

  can_view_material_rate:
    "মালের Rate দেখা/Auto-fill",

  can_view_buyer_contact:
    "ক্রেতার ফোন/ঠিকানা দেখা",

  can_view_report:
    "বিক্রির Report দেখা"

};

function todayInit(){

  document.getElementById(
    "saleDate"
  ).value = today();

}

document.addEventListener(
  "DOMContentLoaded",
  async () => {

    todayInit();

    const {
      data:{session}
    } =
      await sb.auth.getSession();

    if(session)
      await start(session.user);

  }
);

sb.auth.onAuthStateChange(
  async (e,s) => {

    if(e === "SIGNED_OUT")
      location.reload();

    if(e === "SIGNED_IN" && s)
      await start(s.user);

  }
);

async function start(u){

  user = u;

  const r =
    await sb.rpc(
      "ensure_material_sale_access"
    );

  if(r.error){

    document.getElementById(
      "loginBox"
    ).innerHTML =

      "<b>⚠️ Access পাওয়া যায়নি</b>" +

      "<p class='mini'>" +

      esc(r.error.message) +

      "</p>";

    return;

  }

  adminId =
    r.data?.admin_id;

  isAdmin =
    r.data?.admin === true;

  await loadPermissions();

  if(
    !isAdmin &&
    !perm.can_view
  ){

    document.getElementById(
      "loginBox"
    ).classList.add("hidden");

    document.getElementById(
      "app"
    ).classList.remove("hidden");

    document.getElementById(
      "app"
    ).innerHTML =

      '<div class="card">' +

      '<h3>🔒 Access বন্ধ</h3>' +

      '<p>Admin এই পেজ দেখার অনুমতি বন্ধ করেছেন।</p>' +

      '</div>';

    return;

  }

  document.getElementById(
    "loginBox"
  ).classList.add("hidden");

  document.getElementById(
    "app"
  ).classList.remove("hidden");

  if(isAdmin){

    document.getElementById(
      "permBtn"
    ).classList.remove("hidden");

  }

  applyPermissions();

  await loadMaterials();
  await loadBuyers();
  await loadSales();

}

async function loadPermissions(){

  if(isAdmin){

    perm =
      Object.fromEntries(
        Object.keys(P).map(
          k => [k,true]
        )
      );

    return;

  }

  const {
    data,
    error
  } =
    await sb
      .from("material_sale_permissions")
      .select(
        Object.keys(P).join(",")
      )
      .eq(
        "user_id",
        user.id
      )
      .eq(
        "admin_id",
        adminId
      )
      .maybeSingle();

  if(error){

    alert(error.message);
    perm = {};

  }else{

    perm = data || {};

  }

}

function allowed(k){

  return (
    isAdmin ||
    perm[k] === true
  );

}

function applyPermissions(){

  const hide =
    (id,ok) => {

      const e =
        document.getElementById(id);

      if(e)
        e.classList.toggle(
          "hidden",
          !ok
        );

    };

  hide(
    "newSaleCard",
    allowed("can_create_sale") ||
    allowed("can_create_buyer")
  );

  hide(
    "buyersCard",
    allowed("can_view_buyer") ||
    allowed("can_view_due")
  );

  hide(
    "salesCard",
    allowed("can_view_history")
  );

  if(!allowed("can_create_sale")){

    document.getElementById(
      "saveBtn"
    ).disabled = true;

  }

  if(!allowed("can_create_buyer")){

    buyerName.disabled = true;
    buyerPhone.disabled = true;
    buyerAddress.disabled = true;

  }

  const n =
    document.getElementById(
      "permissionNote"
    );

  if(
    !isAdmin &&
    n &&
    !allowed("can_view_material_rate")
  ){

    n.classList.remove("hidden");

    n.innerHTML =
      "ℹ️ আপনার অনুমতি অনুযায়ী কিছু তথ্য/Rate দেখা যাচ্ছে না। Admin চাইলে Permission থেকে পরিবর্তন করতে পারবেন।";

  }

}

async function loadMaterials(){

  const {
    data,
    error
  } =
    await sb.rpc(
      "get_material_sale_materials"
    );

  if(error){

    alert(error.message);
    return;

  }

  materials = data || [];

  document
    .querySelectorAll(".mat-select")
    .forEach(fillSelect);

}

function addRow(){

  if(
    !allowed("can_create_sale")
  )
    return;

  const wrap =
    document.getElementById(
      "rows"
    );

  const id =
    "r" +
    Date.now() +
    Math.random()
      .toString(16)
      .slice(2);

  wrap.insertAdjacentHTML(
    "beforeend",

    `
    <div
      class="sale-row"
      id="${id}">

      <div>

        <label>মাল</label>

        <select
          class="mat-select"
          onchange="rateFromMaterial(this)">

          <option value="">
            মাল নির্বাচন
          </option>

        </select>

      </div>

      <div>

        <label>Rate</label>

        <input
          class="rate"
          type="number"
          min="0"
          step="0.01"
          oninput="recalc()">

      </div>

      <div>

        <label>Qty</label>

        <input
          class="qty"
          type="number"
          min="0"
          step="0.001"
          value="1"
          oninput="recalc()">

      </div>

      <div>

        <label>Total</label>

        <input
          class="line-total"
          readonly>

      </div>

      <button
        class="btn red"
        onclick="
          document.getElementById('${id}').remove();
          recalc();
        ">

        ×

      </button>

    </div>
    `
  );

  fillSelect(
    wrap.lastElementChild
      .querySelector("select")
  );

  recalc();

}

function fillSelect(sel){

  sel.innerHTML =
    '<option value="">মাল নির্বাচন</option>' +

    materials.map(
      m =>

        `<option
          value="${esc(m.id)}"
          data-price="${
            m.price == null
              ? ""
              : Number(m.price)
          }"
          data-name="${esc(m.name)}">

          ${esc(m.name)}

          ${
            m.price == null
              ? ""
              : " — " +
                money(m.price)
          }

        </option>`

    ).join("");

}

function rateFromMaterial(sel){

  if(
    !allowed(
      "can_view_material_rate"
    )
  ){

    alert(
      "মালের Rate দেখার Permission বন্ধ আছে"
    );

    return;

  }

  const o =
    sel.options[
      sel.selectedIndex
    ];

  const row =
    sel.closest(
      ".sale-row"
    );

  row.querySelector(
    ".rate"
  ).value =
    o?.dataset.price || "";

  recalc();

}

function recalc(){

  let total = 0;

  document
    .querySelectorAll(
      ".sale-row"
    )
    .forEach(r => {

      const x =
        Number(
          r.querySelector(
            ".rate"
          ).value || 0
        ) *

        Number(
          r.querySelector(
            ".qty"
          ).value || 0
        );

      r.querySelector(
        ".line-total"
      ).value =
        x.toFixed(2);

      total += x;

    });

  let paid =
    Number(
      document.getElementById(
        "paidNow"
      ).value || 0
    );

  if(
    paymentType.value === "cash"
  )
    paid = total;

  else if(
    paymentType.value === "credit"
  )
    paid = 0;

  else
    paid =
      Math.min(
        paid,
        total
      );

  saleTotal.textContent =
    money(total);

  salePaid.textContent =
    money(paid);

  saleDue.textContent =
    money(
      Math.max(
        0,
        total - paid
      )
    );

}

function paymentChanged(){

  paidNow.value = 0;

  recalc();

}

function resetSale(){

  buyerName.value = "";
  buyerPhone.value = "";
  buyerAddress.value = "";

  saleDate.value =
    today();

  paymentType.value =
    "cash";

  paidNow.value = 0;

  rows.innerHTML = "";

  addRow();

  recalc();

}

async function getOrCreateBuyer(){

  if(
    !allowed(
      "can_create_buyer"
    )
  )
    throw Error(
      "নতুন ক্রেতা তৈরির Permission বন্ধ আছে"
    );

  const name =
    buyerName.value.trim();

  const phone =
    buyerPhone.value.trim();

  const address =
    buyerAddress.value.trim();

  if(!name)
    throw Error(
      "ক্রেতার নাম দিন"
    );

  let q =
    sb
      .from(
        "material_sale_customers"
      )
      .select("*")
      .eq(
        "admin_id",
        adminId
      )
      .eq(
        "user_id",
        user.id
      );

  if(phone)
    q = q.eq(
      "phone",
      phone
    );
  else
    q = q.ilike(
      "name",
      name
    );

  const {
    data,
    error
  } =
    await q.maybeSingle();

  if(error)
    throw error;

  if(data){

    if(
      address &&
      address !== data.address
    ){

      const {
        error:e
      } =
        await sb
          .from(

async function saveSale(){

  if(
    !allowed(
      "can_create_sale"
    )
  ){

    alert(
      "নতুন বিক্রি করার Permission বন্ধ আছে"
    );

    return;

  }

  try{

    const buyer =
      await getOrCreateBuyer();

    let items = [];
    let total = 0;

    document
      .querySelectorAll(
        ".sale-row"
      )
      .forEach(r => {

        const sel =
          r.querySelector(
            ".mat-select"
          );

        const o =
          sel.options[
            sel.selectedIndex
          ];

        const price =
          Number(
            r.querySelector(
              ".rate"
            ).value || 0
          );

        const qty =
          Number(
            r.querySelector(
              ".qty"
            ).value || 0
          );

        if(
          o &&
          o.value &&
          price > 0 &&
          qty > 0
        ){

          const t =
            price * qty;

          items.push({
            material_id:o.value,
            material_name:
              o.dataset.name ||
              o.textContent
                .split(" — ")[0],
            price,
            qty,
            total:t
          });

          total += t;

        }

      });

    if(!items.length){

      alert(
        "কমপক্ষে একটি মাল নির্বাচন করুন"
      );

      return;

    }

    let paid =
      paymentType.value === "cash"
        ? total
        : paymentType.value === "credit"
          ? 0
          : Math.min(
              Number(
                paidNow.value || 0
              ),
              total
            );

    const due =
      Math.max(
        0,
        total - paid
      );

    const {
      data:sale,
      error
    } =
      await sb
        .from(
          "material_sales"
        )
        .insert({
          admin_id:adminId,
          user_id:user.id,
          customer_id:buyer.id,
          sale_date:saleDate.value,
          payment_type:
            paymentType.value,
          total,
          paid,
          due
        })
        .select()
        .single();

    if(error)
      throw error;

    const {
      error:ie
    } =
      await sb
        .from(
          "material_sale_items"
        )
        .insert(
          items.map(
            x => ({
              ...x,
              admin_id:adminId,
              user_id:user.id,
              sale_id:sale.id
            })
          )
        );

    if(ie)
      throw ie;

    if(paid > 0){

      const {
        error:pe
      } =
        await sb
          .from(
            "material_sale_payments"
          )
          .insert({
            admin_id:adminId,
            user_id:user.id,
            sale_id:sale.id,
            payment_date:
              saleDate.value,
            amount:paid,
            note:"বিক্রির সময় জমা"
          });

      if(pe)
        throw pe;

    }

    alert(
      "মাল বিক্রির হিসাব Save হয়েছে"
    );

    resetSale();

    await loadBuyers();
    await loadSales();

  }catch(e){

    alert(
      e.message ||
      "Save করা যায়নি"
    );

  }

}

async function collectBuyerDue(
  customerId
){

  if(
    !allowed(
      "can_collect_due"
    )
  ){

    alert(
      "বাকি আদায়ের Permission বন্ধ আছে"
    );

    return;

  }

  const {
    data:sales
  } =
    await sb
      .from(
        "material_sales"
      )
      .select(
        "id,due,paid,total"
      )
      .eq(
        "admin_id",
        adminId
      )
      .eq(
        "user_id",
        user.id
      )
      .eq(
        "customer_id",
        customerId
      )
      .gt(
        "due",
        0
      )
      .order(
        "sale_date"
      );

  const due =
    (sales || [])
      .reduce(
        (a,s) =>
          a + Number(s.due),
        0
      );

  if(due <= 0){

    alert(
      "কোনো বাকি নেই"
    );

    return;

  }

  const amount =
    Number(
      prompt(
        "কত টাকা নিলেন?\nবর্তমান বাকি: " +
        money(due),
        due
      ) || 0
    );

  if(
    !amount ||
    amount <= 0
  )
    return;

  if(amount > due){

    alert(
      "বাকি থেকে বেশি টাকা নেওয়া যাবে না"
    );

    return;

  }

  let remain = amount;

  for(
    const s of sales
  ){

    if(remain <= 0)
      break;

    const take =
      Math.min(
        remain,
        Number(s.due)
      );

    const {
      error
    } =
      await sb
        .from(
          "material_sale_payments"
        )
        .insert({
          admin_id:adminId,
          user_id:user.id,
          sale_id:s.id,
          payment_date:today(),
          amount:take,
          note:"বাকি আদায়"
        });

    if(error){

      alert(
        error.message
      );

      return;

    }

    const np =
      Number(s.paid) +
      take;

    const nd =
      Math.max(
        0,
        Number(s.total) -
        np
      );

    const {
      error:ue
    } =
      await sb
        .from(
          "material_sales"
        )
        .update({
          paid:np,
          due:nd,
          payment_type:
            nd === 0
              ? "cash"
              : "partial"
        })
        .eq(
          "id",
          s.id
        )
        .eq(
          "user_id",
          user.id
        );

    if(ue){

      alert(
        ue.message
      );

      return;

    }

    remain -= take;

  }

  closeModal();

  await loadBuyers();
  await loadSales();

}

      ] of Object.entries(P)
    ){

      html +=

        `<div class="perm">

          <span>
            ${label}
          </span>

          <label class="switch">

            <input
              type="checkbox"
              ${
                p[k]
                  ? "checked"
                  : ""
              }
              onchange="
                setPerm(
                  '${u.user_id}',
                  '${k}',
                  this.checked
                )
              ">

            <span
              class="slider">
            </span>

          </label>

        </div>`;

    }

    html +=
      `</div></div>`;

  }

  if(
    !users?.length
  ){

    html +=

      '<div class="empty">' +

      'এখনও কোনো Public Website User নেই।' +

      '</div>';

  }

  openModal(html);

}

async function setPerm(
  uid,
  key,
  val
){

  const patch = {};

  patch[key] = val;

  patch.updated_at =
    new Date().toISOString();

  const {
    error
  } =
    await sb
      .from(
        "material_sale_permissions"
      )
      .update(patch)
      .eq(
        "admin_id",
        adminId
      )
      .eq(
        "user_id",
        uid
      );

  if(error){

    alert(
      error.message
    );

    return;

  }

}

async function logout(){

  await sb.auth.signOut();

}

function openModal(html){

  modalContent.innerHTML =
    html;

  modal.classList.remove(
    "hidden"
  );

}

function closeModal(){

  modal.classList.add(
    "hidden"
  );

  modalContent.innerHTML =
    "";

}

</script>

</html>
