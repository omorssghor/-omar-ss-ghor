<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin C Panel - ওমর এস এস ঘর</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f1f3f6;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans Bengali","Segoe UI",sans-serif;
  color:#222;
}

.hidden{
  display:none !important;
}

.login-box{
  width:calc(100% - 30px);
  max-width:430px;
  margin:70px auto;
  background:white;
  padding:25px;
  border-radius:18px;
  box-shadow:0 5px 25px rgba(0,0,0,.12);
}

.login-box h1{
  text-align:center;
  margin:0;
  font-size:25px;
}

.shop-name{
  text-align:center;
  margin:8px 0 25px;
  color:#555;
}

label{
  display:block;
  font-weight:bold;
  margin:15px 0 6px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
}

.login-btn{
  width:100%;
  margin-top:20px;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#111827;
  color:white;
  font-size:17px;
  font-weight:bold;
}

.login-btn:disabled{
  opacity:.6;
}

#message{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  text-align:center;
  display:none;
}

.message-show{
  display:block !important;
}

.message-ok{
  background:#e8f7ed;
  color:#08752a;
}

.message-error{
  background:#fff0f0;
  color:#b00020;
}

.header{
  background:#111827;
  color:white;
  padding:15px;
}

.header-inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header-title{
  font-size:20px;
  font-weight:bold;
}

.logout{
  background:#dc2626;
  color:white;
  border:0;
  padding:9px 13px;
  border-radius:8px;
  font-weight:bold;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:15px;
}

.welcome{
  background:white;
  padding:18px;
  border-radius:15px;
  margin-bottom:15px;
  box-shadow:0 2px 10px rgba(0,0,0,.07);
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.stat{
  background:white;
  padding:18px;
  border-radius:14px;
  box-shadow:0 2px 10px rgba(0,0,0,.07);
}

.stat-title{
  color:#666;
  font-size:14px;
}

.stat-number{
  font-size:23px;
  font-weight:bold;
  margin-top:6px;
}

.menu-box{
  background:white;
  margin-top:15px;
  padding:18px;
  border-radius:15px;
  box-shadow:0 2px 10px rgba(0,0,0,.07);
}

.menu-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.menu{
  background:#f7f7f7;
  border:1px solid #ddd;
  padding:20px 10px;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
}

.menu-icon{
  font-size:28px;
  display:block;
  margin-bottom:5px;
}

@media(max-width:700px){

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .menu-grid{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:400px){

  .header-title{
    font-size:16px;
  }

  .login-box{
    margin-top:35px;
  }

}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div id="loginPage" class="login-box">

  <h1>🔐 Admin C Panel</h1>

  <div class="shop-name">
    🏪 ওমর এস এস ঘর
  </div>

  <label>Admin Email</label>

  <input
    id="email"
    type="email"
    placeholder="Admin Email লিখুন"
    autocomplete="email"
  >

  <label>Password</label>

  <input
    id="password"
    type="password"
    placeholder="Password লিখুন"
    autocomplete="current-password"
  >

  <button
    id="loginButton"
    class="login-btn"
    onclick="adminLogin()"
  >
    🔐 Admin Login
  </button>

  <div id="message"></div>

</div>


<!-- =========================
     ADMIN PANEL
========================= -->

<div id="adminPanel" class="hidden">

  <div class="header">

    <div class="header-inner">

      <div class="header-title">
        🏪 ওমর এস এস ঘর
      </div>

      <button
        class="logout"
        onclick="logout()"
      >
        Logout
      </button>

    </div>

  </div>


  <div class="container">

    <div class="welcome">

      <h2>👋 Admin Panel</h2>

      <div id="adminEmail"></div>

      <p>
        আপনার Admin Control Panel-এ স্বাগতম।
      </p>

    </div>


    <div class="stats">

      <div class="stat">
        <div class="stat-title">
          আজকের বিক্রি
        </div>

        <div
          id="todaySales"
          class="stat-number"
        >
          ৳0
        </div>
      </div>


      <div class="stat">
        <div class="stat-title">
          আজকের আদায়
        </div>

        <div
          id="todayPaid"
          class="stat-number"
        >
          ৳0
        </div>
      </div>


      <div class="stat">
        <div class="stat-title">
          মোট বাকি
        </div>

        <div
          id="totalDue"
          class="stat-number"
        >
          ৳0
        </div>
      </div>


      <div class="stat">
        <div class="stat-title">
          মোট Material
        </div>

        <div
          id="materialCount"
          class="stat-number"
        >
          0
        </div>
      </div>

    </div>


    <div class="menu-box">

      <h2>⚙️ Control Panel</h2>

      <div class="menu-grid">

        <div class="menu" onclick="openPOS()">
          <span class="menu-icon">🛒</span>
          POS
        </div>

        <div class="menu" onclick="showUsers()">
          <span class="menu-icon">👥</span>
          Users
        </div>

        <div class="menu" onclick="showMaterials()">
          <span class="menu-icon">📦</span>
          Material
        </div>

        <div class="menu" onclick="showWorkers()">
          <span class="menu-icon">👷</span>
          Mistri
        </div>

        <div class="menu" onclick="showCustomers()">
          <span class="menu-icon">👤</span>
          Customer
        </div>

        <div class="menu" onclick="showHistory()">
          <span class="menu-icon">📋</span>
          Sales History
        </div>

        <div class="menu" onclick="showDue()">
          <span class="menu-icon">💰</span>
          Due
        </div>

        <div class="menu" onclick="showReports()">
          <span class="menu-icon">📊</span>
          Reports
        </div>

      </div>

    </div>

  </div>

</div>


<script>

/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
"https://gzujcqjpxypcoiqhpvvu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3A5P427eZte1-uOzytOYSA_4bviRFcF";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================
   MESSAGE
===================================== */

function message(text,type){

  const box =
    document.getElementById("message");

  box.textContent = text;

  box.className =
    "message-show " +
    (type === "error"
      ? "message-error"
      : "message-ok");
}


/* =====================================
   LOGIN
===================================== */

async function adminLogin(){

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  const button =
    document.getElementById("loginButton");


  if(!email){

    message(
      "⚠️ Admin Email লিখুন।",
      "error"
    );

    return;
  }


  if(!password){

    message(
      "⚠️ Password লিখুন।",
      "error"
    );

    return;
  }


  button.disabled = true;

  button.textContent =
    "⏳ Login হচ্ছে...";

  message(
    "⏳ Login পরীক্ষা করা হচ্ছে...",
    "ok"
  );


  try{

    /* SUPABASE LOGIN */

    const {
      data,
      error
    } =
      await supabaseClient.auth.signInWithPassword({

        email:email,

        password:password

      });


    if(error){

      const errorText =
        String(
          error.message || ""
        ).toLowerCase();


      if(
        errorText.includes(
          "invalid login credentials"
        )
      ){

        throw new Error(
          "Email অথবা Password সঠিক নয়।"
        );

      }


      if(
        errorText.includes(
          "email not confirmed"
        )
      ){

        throw new Error(
          "এই Email এখনো Confirm করা হয়নি।"
        );

      }


      throw new Error(
        error.message ||
        "Login করা যায়নি।"
      );

    }


    if(
      !data ||
      !data.user
    ){

      throw new Error(
        "Login User পাওয়া যায়নি।"
      );

    }


    /* =================================
       ADMIN CHECK
    ================================= */

    message(
      "⏳ Admin Account যাচাই করা হচ্ছে...",
      "ok"
    );


    const {
      data:adminData,
      error:adminError
    } =
      await supabaseClient
        .from("accounting_admins")
        .select("user_id")
        .eq(
          "user_id",
          data.user.id
        )
        .maybeSingle();


    if(adminError){

      console.error(adminError);

      await supabaseClient.auth.signOut();

      throw new Error(
        "Admin যাচাই করা যায়নি। Database/RLS সমস্যা হয়েছে।"
      );

    }


    if(!adminData){

      await supabaseClient.auth.signOut();

      throw new Error(
        "এই Email Admin হিসেবে যুক্ত নেই।"
      );

    }


    /* =================================
       SUCCESS
    ================================= */

    message(
      "✅ Admin Login সফল হয়েছে!",
      "ok"
    );


    setTimeout(function(){

      document
        .getElementById("loginPage")
        .classList.add("hidden");


      document
        .getElementById("adminPanel")
        .classList.remove("hidden");


      document
        .getElementById("adminEmail")
        .textContent =
        "Admin: " + data.user.email;


      loadDashboard();

    },700);


  }catch(error){

    console.error(error);


    message(
      "❌ " +
      (
        error.message ||
        "Login করা যায়নি।"
      ),
      "error"
    );


    button.disabled = false;

    button.textContent =
      "🔐 Admin Login";

  }

}


/* =====================================
   SESSION CHECK
===================================== */

async function checkSession(){

  try{

    const {
      data
    } =
      await supabaseClient.auth.getSession();


    if(
      !data ||
      !data.session
    ){

      return;

    }


    const user =
      data.session.user;


    const {
      data:adminData,
      error
    } =
      await supabaseClient
        .from("accounting_admins")
        .select("user_id")
        .eq(
          "user_id",
          user.id
        )
        .maybeSingle();


    if(
      error ||
      !adminData
    ){

      await supabaseClient.auth.signOut();

      return;

    }


    document
      .getElementById("loginPage")
      .classList.add("hidden");


    document
      .getElementById("adminPanel")
      .classList.remove("hidden");


    document
      .getElementById("adminEmail")
      .textContent =
      "Admin: " + user.email;


    loadDashboard();

  }catch(error){

    console.error(error);

  }

}


/* =====================================
   DASHBOARD
===================================== */

async function loadDashboard(){

  try{

    const today =
      new Date()
        .toISOString()
        .slice(0,10);


    const {
      data:sales
    } =
      await supabaseClient
        .from("material_sales")
        .select(
          "sale_date,total,paid,due"
        );


    let todaySales = 0;

    let todayPaid = 0;

    let totalDue = 0;


    (sales || []).forEach(function(row){

      totalDue +=
        Number(row.due || 0);


      if(
        row.sale_date === today
      ){

        todaySales +=
          Number(row.total || 0);

        todayPaid +=
          Number(row.paid || 0);

      }

    });


    document
      .getElementById("todaySales")
      .textContent =
      "৳" + todaySales;


    document
      .getElementById("todayPaid")
      .textContent =
      "৳" + todayPaid;


    document
      .getElementById("totalDue")
      .textContent =
      "৳" + totalDue;


    const {
      count
    } =
      await supabaseClient
        .from("materials")
        .select(
          "id",
          {
            count:"exact",
            head:true
          }
        );


    document
      .getElementById("materialCount")
      .textContent =
      count || 0;


  }catch(error){

    console.error(error);

  }

}


/* =====================================
   LOGOUT
===================================== */

async function logout(){

  await supabaseClient.auth.signOut();

  location.reload();

}


/* =====================================
   MENU
===================================== */

function openPOS(){

  window.location.href =
    "pos.html";

}


function showUsers(){

  alert(
    "Users Management পরের ধাপে চালু করা হবে।"
  );

}


function showMaterials(){

  alert(
    "Material Management পরের ধাপে চালু করা হবে।"
  );

}


function showWorkers(){

  alert(
    "Mistri Management পরের ধাপে চালু করা হবে।"
  );

}


function showCustomers(){

  alert(
    "Customer Management পরের ধাপে চালু করা হবে।"
  );

}


function showHistory(){

  alert(
    "Sales History পরের ধাপে চালু করা হবে।"
  );

}


function showDue(){

  alert(
    "Due Management পরের ধাপে চালু করা হবে।"
  );

}


function showReports(){

  alert(
    "Reports পরের ধাপে চালু করা হবে।"
  );

}


/* =====================================
   ENTER KEY LOGIN
===================================== */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter"
    ){

      const loginPage =
        document.getElementById(
          "loginPage"
        );

      if(
        !loginPage.classList.contains(
          "hidden"
        )
      ){

        adminLogin();

      }

    }

  }
);


/* =====================================
   START
===================================== */

checkSession();

</script>

</body>
</html>
